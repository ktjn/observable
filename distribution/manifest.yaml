# Observable distribution manifest (Phase 7, docs/component-decomposition.md).
#
# Pins the tested component-version set for a product release. This file is the
# authoritative source of per-component versions (see VERSIONING.md):
# - productVersion must equal the root VERSION;
# - each component version must equal its own package version (Cargo package for
#   Rust services, apps/frontend/package.json for web), so a component version
#   changes only by editing both together;
# - component versions may diverge from productVersion.
# `observable-distribution` (the future composition repository) consumes this
# manifest to install a pinned set. Validate with
# scripts/check-distribution-manifest.sh.
#
# Keys are the target component names from docs/component-decomposition.md.
# `contracts` is the versioned integration-contract component (no runtime
# image); `web` is the frontend image; the rest map to one Rust service image
# each (see scripts/build-component-images.sh).
productVersion: 0.1.0
components:
  contracts: 0.1.0
  auth: 0.1.0
  control: 0.1.0
  ingest: 0.1.0
  process: 0.1.0
  storeClickhouse: 0.1.0
  query: 0.1.0
  alerting: 0.1.0
  web: 0.1.0
