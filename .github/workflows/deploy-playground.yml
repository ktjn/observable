name: Deploy Playground

# Builds the browser-only WASM playground (docs/superpowers/plans/2026-08-21-github-pages-wasm-playground.md)
# and publishes it to GitHub Pages. The build+smoke-test job runs on every
# PR that touches playground-relevant paths so regressions are caught
# before merge; the deploy job only runs on pushes to main, so PRs never
# publish anything.

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'libs/playground-wasm/**'
      - 'libs/query-core/**'
      - 'libs/domain-core/**'
      - 'scripts/build-playground.sh'
      - '.github/workflows/deploy-playground.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'libs/playground-wasm/**'
      - 'libs/query-core/**'
      - 'libs/domain-core/**'
      - 'scripts/build-playground.sh'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WASM_PACK_VERSION: 0.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl -fsSL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz --strip-components=1 -C /usr/local/bin "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack"
          chmod +x /usr/local/bin/wasm-pack

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", cache: "npm" }

      - name: Build playground artifact
        run: bash scripts/build-playground.sh

      # Asset-integrity smoke check: proves the built static artifact
      # actually boots the wasm/DuckDB pipeline end-to-end (not just that
      # the build succeeded) before it's ever published.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/frontend
      - name: Playground e2e smoke test
        run: npx playwright test --config=playwright.playground.config.ts
        working-directory: apps/frontend

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/frontend/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
