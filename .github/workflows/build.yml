name: Build Artifacts

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'spec/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'spec/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.surfaces.outputs.backend }}
      frontend: ${{ steps.surfaces.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: surfaces
        run: bash scripts/ci-changed-surfaces.sh "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

  backend:
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == '1'
    runs-on: ubuntu-latest
    env:
      RUST_VERSION: 1.97.1-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ubuntu-latest ships ~20-30GB of preinstalled toolchains we don't use
      # (Android SDK, .NET, GHC, unused Docker images). A full cold rebuild
      # after a Cargo.lock-changing dependency bump (new cache key, so no
      # warm target/ to reuse) plus the rust:bookworm build image and the
      # runtime image build can otherwise exhaust the runner's free space
      # mid-build. Only pay this ~2m cleanup cost when we're actually close
      # to running out (warm-cache runs have plenty of headroom already).
      - name: Free disk space
        run: |
          avail_mb=$(df --output=avail -m / | tail -1 | tr -d ' ')
          if [ "$avail_mb" -lt 20480 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /usr/lib/jvm
            docker image prune -af
          fi
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo-ci/registry
            ~/.cargo-ci/git
            ~/.cargo-ci/target
            ~/.cache/sccache
          key: cargo-sccache-v1-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            cargo-sccache-v1-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}-
            cargo-sccache-v1-${{ env.RUST_VERSION }}-
            cargo-sccache-v1-

      # Cache the static sccache binary between artifact builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: tool-cache
        with:
          path: ~/.cache/ci-tools
          key: ci-tools-v2-sccache-0.16.0

      # Compile against bookworm, matching the runtime image glibc.
      # Validation runs locally through scripts/local-ci.sh.
      - name: Build release binaries
        env:
          RUSTC_WRAPPER: sccache
          CC: sccache cc
          CXX: sccache c++
          SCCACHE_DIR: /sccache
          CARGO_INCREMENTAL: "0"
        run: |
          mkdir -p ~/.cargo-ci/registry ~/.cargo-ci/git ~/.cargo-ci/target ~/.cache/sccache ~/.cache/ci-tools
          docker run --rm \
            -v "$PWD":/app -w /app \
            -v "$HOME/.cargo-ci/registry":/usr/local/cargo/registry \
            -v "$HOME/.cargo-ci/git":/usr/local/cargo/git \
            -v "$HOME/.cargo-ci/target":/app/target \
            -v "$HOME/.cache/sccache":/sccache \
            -v "$HOME/.cache/ci-tools":/ci-tools \
            -e RUSTC_WRAPPER -e CC -e CXX -e SCCACHE_DIR -e CARGO_INCREMENTAL \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            rust:${{ env.RUST_VERSION }} bash -c '
              set -euo pipefail

              if [ ! -x /ci-tools/sccache ]; then
                curl -L https://github.com/mozilla/sccache/releases/download/v0.16.0/sccache-v0.16.0-x86_64-unknown-linux-musl.tar.gz | tar xz --strip-components=1 -C /ci-tools sccache-v0.16.0-x86_64-unknown-linux-musl/sccache
                chmod +x /ci-tools/sccache
              fi
              export PATH="/ci-tools:$PATH"

              # Ensure stats are shown and server is stopped even on failure
              trap "sccache --show-stats; sccache --stop-server || true" EXIT

              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential cmake libcurl4-openssl-dev libssl-dev pkg-config zlib1g-dev
              sccache --start-server
              cargo build --release --workspace
            '

      - name: Fix permissions for caching
        if: always()
        run: |
          # Container runs as root, so cache files end up root-owned on the
          # host mounts; chown back to the runner user or actions/cache's
          # post-job tar step cannot read them to persist the cache.
          sudo chown -R $(id -u):$(id -g) ~/.cargo-ci ~/.cache/sccache ~/.cache/ci-tools

      - name: Stage release binaries for Docker context
        run: |
          mkdir -p bin
          cp ~/.cargo-ci/target/release/auth-service ~/.cargo-ci/target/release/storage-writer \
             ~/.cargo-ci/target/release/stream-processor ~/.cargo-ci/target/release/ingest-gateway \
             ~/.cargo-ci/target/release/query-api ~/.cargo-ci/target/release/alert-evaluator \
             ~/.cargo-ci/target/release/admin-service bin/

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build component images (prebuilt binaries)
        env:
          BUILD_TARGET: component-runtime-ci
        run: bash scripts/build-component-images.sh auth control ingest process store-clickhouse query alerting

      - name: Export images
        run: |
          docker save \
            observable-auth:local observable-control:local observable-ingest:local \
            observable-process:local observable-store-clickhouse:local observable-query:local \
            observable-alerting:local | gzip > /tmp/image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docker-image
          path: /tmp/image.tar.gz
          retention-days: 1

  frontend:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "24", cache: "npm" }
      - run: npm ci
      - run: npm run build --workspace=apps/frontend
