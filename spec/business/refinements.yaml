# Declared deviations of spec/business/ from the immutable baseline.
# Checked by scripts/check-business-baseline.py. Not included by spec/system.yaml.
# Changing or removing baseline content needs an entry here with a reason and a decision reference.
# Additions (new interactions, scenarios, list items) need no entry.
baseline: spec/business/baseline/v2.5
source:
