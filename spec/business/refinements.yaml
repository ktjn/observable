- path: experiences/UX-06/scenarios/ux-06-failure
  reason: 'Bundled negative split: ux-06-failure now exercises only ux-06-transition; the entry path moved to ux-06-entry-failure. Requirement union unchanged.'
  decision: docs/plans/phase0-assurance-hardening.md section 8 (2.0 re-review)
- path: experiences/UX-07/scenarios/ux-07-success/requirements
  reason: OBS-24-11 (refresh does not move inspection) moved to ux-07-refresh-success and ux-02-refresh-success, which exercise refresh; OBS-03-01 added.
