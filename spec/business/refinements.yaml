    target: Retargeted from logical area.holder to an Observable capability (ADR-037, plan Q8). Area and holder stay recoverable from the baseline target.
    version: Requirement versions restart at 0.1.0 on the 2.0 line (plan section 5a).
  risks:
    id_prefix: obs-
    fields:
      target: Retargeted from logical area to an Observable capability or the system (ADR-037).
  reference_paths:
