components:
- id: asset-governance
  version: '1.0'
  status: specified
  description: Govern alerts, objectives, dashboards, checks and health rules as owned, managed business assets.
  owner: observability-platform-owner
  layer: governance
  domain: service-model
  provides:
  - asset-governance.platform
  - asset-governance.process
  - asset-governance.organization
capabilities:
- id: asset-governance.platform
  version: '1.0'
  status: specified
  description: Observability configuration and asset governance — capability of the observability product or tooling; verified by test or demonstration.
  postconditions:
  - asset_changes_reviewable_and_reversible
  invariants:
  - every_asset_has_owner
  failure_modes:
  - unowned_asset
  - unreviewed_critical_change
- id: asset-governance.process
  version: '1.0'
  status: specified
  description: Observability configuration and asset governance — operational process performed with the platform; verified by exercise or record review.
  postconditions:
  - asset_changes_reviewable_and_reversible
  invariants:
  - every_asset_has_owner
  failure_modes:
  - unowned_asset
  - unreviewed_critical_change
  - process_not_followed
- id: asset-governance.organization
  version: '1.0'
  status: specified
  description: Observability configuration and asset governance — governance obligation such as ownership, approval or policy; verified by inspection.
  postconditions:
  - asset_changes_reviewable_and_reversible
  invariants:
  - every_asset_has_owner
  failure_modes:
  - unowned_asset
  - unreviewed_critical_change
  - accountability_unassigned
requirements:
- id: OBS-34-01
  version: '1.0'
  target: asset-governance.organization
  holder: organization
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: observability-platform-owner
  statement: Alerts, objectives, dashboards, proactive checks and health rules shall each have an accountable owner.
  criteria:
  - id: acceptance
    text: 'Acceptance: Any critical alert shows its current owner.'
  - id: negative
    text: 'Negative: An asset whose owner leaves is reported as ownerless.'
- id: OBS-34-02
  version: '1.0'
  target: asset-governance.platform
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Changes to critical observability configuration shall be versioned, reviewable and reversible.
  criteria:
  - id: acceptance
    text: 'Acceptance: A changed alert threshold can be compared with and restored to its previous version.'
- id: OBS-34-03
  version: '1.0'
  target: asset-governance.process
  holder: process
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Changes to critical observability configuration shall follow an approval process proportionate to risk.
  criteria:
  - id: acceptance
    text: 'Acceptance: A change to a critical alert route requires approval before taking effect.'
- id: OBS-34-04
  version: '1.0'
  target: asset-governance.platform
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: The organization shall be able to apply observability configuration consistently across environments and reuse approved templates.
  criteria:
  - id: acceptance
    text: 'Acceptance: A new service adopts the standard critical-alert set from an approved template.'
- id: OBS-34-05
  version: '1.0'
  target: asset-governance.platform
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Unused, ownerless, duplicate or obsolete observability assets shall be identifiable for review or retirement.
  criteria:
  - id: acceptance
    text: 'Acceptance: A quarterly review lists unviewed dashboards and never-triggered alerts with owners.'
- id: OBS-34-06
  version: '1.0'
  target: asset-governance.platform
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: observability-platform-owner
  statement: Teams shall be able to manage observability configuration together with the service it observes.
  criteria:
  - id: acceptance
    text: 'Acceptance: A service change and its related alert change are reviewed and released together.'
