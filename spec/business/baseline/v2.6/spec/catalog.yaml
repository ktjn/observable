roles:
  observability-platform-owner: Accountable for the observability capability as a business service, its experience and its assets.
  head-of-operations: Accountable for service health, capacity and scheduled processing in production.
  sre-lead: Accountable for reliability objectives, alerting, investigation, runbooks and coverage.
  incident-manager: Accountable for the incident and problem process.
  customer-experience-owner: Accountable for customer journeys and their proactive verification.
  business-process-owner: Accountable for end-to-end business processes and individual transaction outcomes.
  service-management-lead: Accountable for the service catalog and its reconciliation with authoritative records.
  enterprise-architect: Accountable for dependency information and interoperability.
  head-of-engineering: Accountable for change assurance and responder sustainability.
  ciso: Accountable for security controls and access.
  dpo: Accountable for personal-data protection and privacy obligations.
  head-of-compliance: Accountable for regulatory and audit obligations.
  finops-lead: Accountable for observability cost and value.
  operational-resilience-lead: Accountable for resilience of essential operational awareness.
  communications-lead: Accountable for internal and external incident communication.
  ai-model-owner: Accountable for AI-enabled services and their behavior.
  vendor-manager: Accountable for third-party providers and contracts.
