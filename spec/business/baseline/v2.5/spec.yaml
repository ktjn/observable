system:
  id: observability-platform
  version: '2.5'
  status: specified
  layers:
  - experience
  - capability
  - governance
  domains:
  - id: service-model
    description: Services, ownership, coverage obligations and observability assets.
  - id: service-health
    description: Condition, performance, customer, process and scheduled-work outcomes.
  - id: reliability
    description: Objectives, error budgets and change assurance.
  - id: response
    description: Alerting, incidents, triage, guidance, responders and communication.
  - id: investigation
    description: Diagnosis, exploration, dependencies, impact and transaction tracing.
  - id: governance
    description: Security, privacy, compliance, cost and data quality.
  - id: ecosystem
    description: Interoperability and third-party providers.
  - id: intelligence
    description: Assistance, automation and AI-enabled services.
  - id: experience
    description: Reporting, navigation, workspaces, interaction states and access.
  - id: platform-trust
    description: The observability capability as an accountable, resilient service.
  quality_attributes:
    responsiveness: Essential views within business-approved times during major incidents (OBS-19-08).
    scalability: Detection and notification sustained within approved planning ranges (OBS-19-09).
    resilience: Essential awareness under agreed disruption scenarios (OBS-29-01).
state_sets:
  baseline:
    loading: Indicate that evidence is being retrieved without implying a service is healthy.
    ready: Show the current scoped evidence and when it was observed.
    empty: Explain that no authorized records match the selection.
    stale: Show the age of evidence and warn against interpreting it as current.
    error: Explain the failed operation and provide a safe recovery route.
    unauthorized: Withhold restricted content and actions without exposing the existence of protected records.
include:
- spec/areas/*.yaml
- spec/risks.yaml
- spec/experience/*.yaml
capabilities: []
components: []
