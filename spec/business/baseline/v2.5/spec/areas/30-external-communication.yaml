components:
- id: external-communication
  version: '1.0'
  status: specified
  description: Provide controlled, accurate communication of operational impact to relevant audiences.
  owner: communications-lead
  layer: experience
  domain: response
  provides:
  - external-communication.platform
capabilities:
- id: external-communication.platform
  version: '1.0'
  status: specified
  description: External communication — capability of the observability product or tooling; verified by test or demonstration.
  postconditions:
  - approved_update_reaches_audience
  invariants:
  - updates_label_facts_estimates_unknowns
  failure_modes:
  - restricted_content_disclosed
  - unapproved_update
requirements:
- id: OBS-30-01
  version: '1.0'
  target: external-communication.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: communications-lead
  statement: Authorized stakeholders shall be able to communicate confirmed incident status and impact to designated internal or external audiences.
  criteria:
  - 'Acceptance: A communications owner issues an approved incident update to a defined audience.'
- id: OBS-30-02
  version: '1.0'
  target: external-communication.platform
  kind: functional
  category: semantic
  mandatory: false
  status: specified
  priority: P1
  owner: communications-lead
  statement: Incident updates shall distinguish verified facts, estimates, unknowns, and next expected updates.
  criteria:
  - 'Acceptance: An update clearly labels suspected scope and confirmed affected services.'
- id: OBS-30-03
  version: '1.0'
  target: external-communication.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: communications-lead
  statement: Stakeholders shall be able to track communication ownership, approval, timing and prior updates.
  criteria:
  - 'Acceptance: A review shows who approved and released each incident communication.'
- id: OBS-30-04
  version: '1.0'
  target: external-communication.platform
  kind: non-functional
  category: security
  mandatory: false
  status: specified
  priority: P1
  owner: communications-lead
  statement: Communication content shall be appropriate to audience, authorization, and applicable disclosure rules.
  criteria:
  - 'Acceptance: A customer-facing summary contains no internal-only or restricted evidence.'
