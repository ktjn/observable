components:
- id: responders
  version: '1.0'
  status: specified
  description: Keep the people who respond to incidents effective, correctly reached and not overloaded.
  owner: head-of-engineering
  layer: capability
  domain: response
  provides:
  - responders.platform
  - responders.process
capabilities:
- id: responders.platform
  version: '1.0'
  status: specified
  description: Responder load and on-call sustainability — capability of the observability product or tooling; verified by test or demonstration.
  postconditions:
  - current_responder_reached
  invariants:
  - schedule_gaps_detected_before_occurring
  failure_modes:
  - coverage_gap
  - responder_overload
- id: responders.process
  version: '1.0'
  status: specified
  description: Responder load and on-call sustainability — operational process performed with the platform; verified by exercise or record review.
  postconditions:
  - current_responder_reached
  invariants:
  - schedule_gaps_detected_before_occurring
  failure_modes:
  - coverage_gap
  - responder_overload
  - process_not_followed
requirements:
- id: OBS-37-01
  version: '1.0'
  target: responders.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-engineering
  statement: Responsibility schedules, including rotations, overrides and cross-location handovers, shall determine who is notified at any time.
  criteria:
  - 'Acceptance: A schedule override routes a critical alert to the substitute responder.'
  depends_on:
  - OBS-07-01
- id: OBS-37-02
  version: '1.0'
  target: responders.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-engineering
  statement: Gaps in responsibility coverage shall be detected before they occur.
  criteria:
  - 'Acceptance: A schedule gap next week is flagged to the team owner.'
- id: OBS-37-03
  version: '1.0'
  target: responders.process
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-engineering
  statement: Managers shall be able to review responder load, including notification volume, out-of-hours interruptions and incident time, subject to applicable employment and privacy rules.
  criteria:
  - 'Acceptance: A monthly review shows out-of-hours interruptions per team.'
- id: OBS-37-04
  version: '1.0'
  target: responders.process
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-engineering
  statement: Teams shall be able to identify when responder load exceeds agreed sustainable levels and record remediation.
  criteria:
  - 'Acceptance: A team above its agreed out-of-hours level has a recorded action and owner.'
- id: OBS-37-05
  version: '1.0'
  target: responders.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: head-of-engineering
  statement: Responders shall be able to manage personal notification preferences within approved policy without weakening critical escalation.
  criteria:
  - 'Acceptance: A responder changes channel, and critical escalation still reaches them.'
