components:
- id: providers
  version: '1.0'
  status: specified
  description: Treat material providers as observed dependencies with owned risk, evidence and coordination.
  owner: vendor-manager
  layer: capability
  domain: ecosystem
  provides:
  - providers.platform
  - providers.organization
capabilities:
- id: providers.platform
  version: '1.0'
  status: specified
  description: Third-party and provider assurance — capability of the observability product or tooling; verified by test or demonstration.
  postconditions:
  - provider_dependency_and_performance_known
  invariants:
  - material_provider_mapped_to_functions
  failure_modes:
  - undetected_provider_outage
  - concentration_risk
- id: providers.organization
  version: '1.0'
  status: specified
  description: Third-party and provider assurance — governance obligation such as ownership, approval or policy; verified by inspection.
  postconditions:
  - provider_dependency_and_performance_known
  invariants:
  - material_provider_mapped_to_functions
  failure_modes:
  - undetected_provider_outage
  - concentration_risk
  - accountability_unassigned
requirements:
- id: OBS-36-01
  version: '1.0'
  target: providers.organization
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: vendor-manager
  statement: Material third-party providers shall be identified with the business services, functions and contracts that depend on them.
  criteria:
  - 'Acceptance: A provider record lists its dependent critical functions and contract owner.'
  - 'Negative: A critical function depending on an unregistered provider is reported as a gap.'
- id: OBS-36-02
  version: '1.0'
  target: providers.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Users shall be able to observe provider performance and availability as experienced by the organization, independently of provider-reported status.
  criteria:
  - 'Acceptance: A provider outage is detected before the provider reports it.'
- id: OBS-36-03
  version: '1.0'
  target: providers.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Provider-reported status and notices shall be visible alongside the organization’s own evidence.
  criteria:
  - 'Acceptance: A provider maintenance notice appears in the affected service context.'
- id: OBS-36-04
  version: '1.0'
  target: providers.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Owners shall be able to assess provider performance against contractual commitments over a period.
  criteria:
  - 'Acceptance: A quarterly review shows provider SLA attainment from the organization’s own evidence.'
- id: OBS-36-05
  version: '1.0'
  target: providers.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Users shall be able to identify concentration risk where multiple critical functions depend on the same provider or shared component.
  criteria:
  - 'Acceptance: A report lists critical functions sharing a single provider.'
- id: OBS-36-06
  version: '1.0'
  target: providers.platform
  kind: functional
  category: contract
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Responders shall be able to coordinate incidents with providers and record shared timelines, references and commitments.
  criteria:
  - 'Acceptance: A joint incident shows the provider case reference, contacts and updates.'
