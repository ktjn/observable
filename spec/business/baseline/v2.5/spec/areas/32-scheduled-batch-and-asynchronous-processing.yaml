components:
- id: batch-processing
  version: '1.0'
  status: specified
  description: Make time-bound and queued business processing as observable as interactive services.
  owner: head-of-operations
  layer: capability
  domain: service-health
  provides:
  - batch-processing.platform
capabilities:
- id: batch-processing.platform
  version: '1.0'
  status: specified
  description: Scheduled, batch and asynchronous processing — capability of the observability product or tooling; verified by test or demonstration.
  postconditions:
  - deadline_risk_detected_before_cut_off
  invariants:
  - registered_process_has_deadline_and_owner
  failure_modes:
  - missed_cut_off
  - silent_non_start
  - missing_delivery
requirements:
- id: OBS-32-01
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: head-of-operations
  statement: Owners shall be able to register critical scheduled and batch processes with their expected timing, dependencies and business deadlines.
  criteria:
  - 'Acceptance: An end-of-day process shows expected start, completion deadline and owner.'
  - 'Negative: A critical process registered without a deadline or owner is flagged as incomplete.'
- id: OBS-32-02
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: head-of-operations
  statement: The platform shall detect processes that fail, do not start, run late or risk missing a business deadline.
  criteria:
  - 'Acceptance: A delayed run triggers an at-risk warning before its cut-off.'
  - 'Negative: A process that never starts is detected before its cut-off, not only after.'
- id: OBS-32-03
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-operations
  statement: Users shall be able to see backlog, age and throughput of queued or asynchronous work for critical processes.
  criteria:
  - 'Acceptance: A growing backlog is visible with the age of its oldest item.'
- id: OBS-32-04
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-operations
  statement: Owners shall be able to verify completeness and timeliness of critical data deliveries and file exchanges, including those with external parties.
  criteria:
  - 'Acceptance: A missing inbound file is reported to its owner by the agreed time.'
- id: OBS-32-05
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: head-of-operations
  statement: Users shall be able to assess downstream business consequences when a scheduled process or data delivery is late or incomplete.
  criteria:
  - 'Acceptance: A late settlement run shows dependent processes and deadlines at risk.'
- id: OBS-32-06
  version: '1.0'
  target: batch-processing.platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: head-of-operations
  statement: Owners shall be able to compare run durations and volumes with comparable historical runs to anticipate deadline risk.
  criteria:
  - 'Acceptance: A run trending slower than comparable runs is flagged before its deadline.'
