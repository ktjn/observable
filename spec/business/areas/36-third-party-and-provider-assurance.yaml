# Derived from immutable observability-spec v2.6 (7ce467c); target, version, status retained.
requirements:
- id: OBS-36-01
  version: 0.1.0
  target: manage-providers
  holder: organization
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: vendor-manager
  statement: Material third-party providers shall be identified with the business services, functions and contracts that depend on them.
  criteria:
  - id: acceptance
    text: 'Acceptance: A provider record lists its dependent critical functions and contract owner.'
  - id: negative
    text: 'Negative: A critical function depending on an unregistered provider is reported as a gap.'
- id: OBS-36-02
  version: 0.1.0
  target: manage-providers
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Users shall be able to observe provider performance and availability as experienced by the organization, independently of provider-reported status.
  criteria:
  - id: acceptance
    text: 'Acceptance: A provider outage is detected before the provider reports it.'
- id: OBS-36-03
  version: 0.1.0
  target: manage-providers
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Provider-reported status and notices shall be visible alongside the organization’s own evidence.
  criteria:
  - id: acceptance
    text: 'Acceptance: A provider maintenance notice appears in the affected service context.'
- id: OBS-36-04
  version: 0.1.0
  target: manage-providers
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Owners shall be able to assess provider performance against contractual commitments over a period.
  criteria:
  - id: acceptance
    text: 'Acceptance: A quarterly review shows provider SLA attainment from the organization’s own evidence.'
- id: OBS-36-05
  version: 0.1.0
  target: manage-providers
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Users shall be able to identify concentration risk where multiple critical functions depend on the same provider or shared component.
  criteria:
  - id: acceptance
    text: 'Acceptance: A report lists critical functions sharing a single provider.'
- id: OBS-36-06
  version: 0.1.0
  target: manage-providers
  holder: platform
  kind: functional
  category: contract
  mandatory: false
  status: specified
  priority: P1
  owner: vendor-manager
  statement: Responders shall be able to coordinate incidents with providers and record shared timelines, references and commitments.
  criteria:
  - id: acceptance
    text: 'Acceptance: A joint incident shows the provider case reference, contacts and updates.'
