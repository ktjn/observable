# Derived from the immutable baseline spec/business/baseline/v2.7.3 (observability-spec a064fe2).
# Deviations are declared in spec/business/refinements.yaml and checked by scripts/check-business-baseline.py.
# Change meaning or priority only through system-spec/FEATURE.md with impact analysis and owner review.
requirements:
- id: OBS-06-01
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: sre-lead
  statement: Service owners shall be able to define service-level indicators (SLIs) for customer-relevant outcomes.
  criteria:
  - id: acceptance
    text: 'Acceptance: An owner can identify the measured outcome and calculation scope for each critical SLI.'
  - id: negative
    text: 'Negative: An SLI without a defined outcome or scope cannot be used for an approved objective.'
- id: OBS-06-02
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: sre-lead
  statement: Service owners shall be able to approve service-level objectives (SLOs) and evaluation periods.
  criteria:
  - id: acceptance
    text: 'Acceptance: A critical service has an approved target, time period, and accountable owner.'
  - id: negative
    text: 'Negative: An SLO lacking an approver or evaluation period is not reported as approved.'
- id: OBS-06-03
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: semantic
  mandatory: true
  status: verified
  priority: P0
  owner: sre-lead
  statement: Users shall be able to distinguish objectives, internal commitments, and contractual service-level agreements.
  criteria:
  - id: acceptance
    text: 'Acceptance: A review cannot confuse an internal SLO with a contractual SLA.'
  - id: negative
    text: 'Negative: An internal SLO cannot be presented or reported as a contractual SLA.'
- id: OBS-06-04
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: sre-lead
  statement: The platform shall show attainment, breaches, and remaining error budget for agreed SLOs.
  criteria:
  - id: acceptance
    text: 'Acceptance: A known period of failures changes attainment and remaining budget as expected.'
  - id: negative
    text: 'Negative: Missing evidence in the evaluation period is disclosed and is not counted as good events.'
- id: OBS-06-05
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: sre-lead
  statement: Users shall be warned when a service is at risk of breaching its objective during the evaluation period.
  criteria:
  - id: acceptance
    text: 'Acceptance: A simulated accelerated consumption of error budget generates an at-risk state.'
- id: OBS-06-06
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: sre-lead
  statement: Management shall be able to review reliability results by service, business area, and reporting period.
  criteria:
  - id: acceptance
    text: 'Acceptance: A monthly review correctly distinguishes passing and failing objectives.'
- id: OBS-06-07
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: sre-lead
  statement: Objective definitions and target changes shall remain reviewable over time.
  criteria:
  - id: acceptance
    text: 'Acceptance: A historical report uses the target in force for the selected period.'
- id: OBS-06-08
  version: 0.1.0
  target: manage-reliability-objectives
  holder: process
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: sre-lead
  statement: Service owners shall be able to agree and record the consequences of error-budget exhaustion, such as release restrictions or prioritized reliability work.
  criteria:
  - id: acceptance
    text: 'Acceptance: An exhausted budget shows the agreed policy, the decision taken and the accountable approver.'
- id: OBS-06-09
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: sre-lead
  statement: Owners shall be able to define objectives for customer journeys and business services composed of multiple services.
  criteria:
  - id: acceptance
    text: 'Acceptance: A journey objective reflects failures in any contributing service according to agreed rules.'
- id: OBS-06-10
  version: 0.1.0
  target: manage-reliability-objectives
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: vendor-manager
  statement: Business owners shall be able to assess contractual service-level performance and resulting obligations, credits or penalties.
  criteria:
  - id: acceptance
    text: 'Acceptance: A contract review shows SLA attainment and resulting obligations for the period, labeled as evidence or estimate.'
  depends_on:
  - OBS-06-03
  - OBS-36-04
