# Derived from the immutable baseline spec/business/baseline/v2.5 (observability-spec 523e682).
# Deviations are declared in spec/business/refinements.yaml and checked by scripts/check-business-baseline.py.
# Change meaning or priority only through system-spec/FEATURE.md with impact analysis and owner review.
# Area: Observe what customers experience, not only internal service status.
requirements:
- id: OBS-05-01
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: customer-experience-owner
  statement: The platform shall expose success, failure, and responsiveness of designated critical digital user journeys.
  criteria:
  - 'Acceptance: A failed customer journey is reflected in a customer-facing health view.'
  - 'Negative: A journey whose evidence stops arriving shows unknown, not success.'
- id: OBS-05-02
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: customer-experience-owner
  statement: Users shall be able to determine whether a problem affects customers even when internal services appear healthy.
  criteria:
  - 'Acceptance: A simulated client-side failure is detected as customer impact.'
  - 'Negative: A client-side failure with healthy back-end services is still reported as customer impact.'
- id: OBS-05-03
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: customer-experience-owner
  statement: Users shall be able to compare customer experience by applicable channel, client category, geography, and version.
  criteria:
  - 'Acceptance: A selected channel-specific issue is distinguishable from general degradation.'
- id: OBS-05-04
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: deprecated
  priority: P1
  owner: customer-experience-owner
  superseded_by: OBS-28-01
  statement: The platform shall support proactive verification of critical customer journeys before actual customers are affected.
  criteria:
  - 'Acceptance: A controlled failure in a monitored journey is reported before a real customer report is required.'
- id: OBS-05-05
  version: 0.1.0
  target: assess-customer-experience
  kind: non-functional
  category: security
  mandatory: false
  status: specified
  priority: P1
  owner: dpo
  statement: Customer experience assessments shall respect approved privacy and consent rules.
  criteria:
  - 'Acceptance: An authorized privacy review finds no prohibited personal content in journey evidence.'
- id: OBS-05-06
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: customer-experience-owner
  statement: Business owners shall be able to measure experience trends and relate them to customer-facing outcomes.
  criteria:
  - 'Acceptance: A reporting view compares journey quality and a selected approved customer outcome.'
- id: OBS-05-07
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: customer-experience-owner
  statement: Users shall be able to assess the stability of customer-facing applications by release version, including crashes, freezes and forced exits.
  criteria:
  - 'Acceptance: A newly released mobile version with elevated crash frequency is distinguishable from prior versions.'
- id: OBS-05-08
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: customer-experience-owner
  statement: The platform shall relate customer-reported problems, including support contacts and complaints, to observed service conditions where that information is available.
  criteria:
  - 'Acceptance: A rise in support contacts about a journey is visible alongside the related degradation.'
- id: OBS-05-09
  version: 0.1.0
  target: assess-customer-experience
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P2
  owner: customer-experience-owner
  statement: The organization shall be able to observe the digital experience of employees using critical internal applications.
  criteria:
  - 'Acceptance: A location-specific slowdown of an internal application is identified by site.'
