# Imported from observability-spec v2.5 (523e682); retargeted to Observable capabilities.
# See docs/plans/business-spec-adoption.md. Edit here; the upstream repo is retired after merge.
# Area: Ensure operational decisions can be based on transparent and dependable observations.
requirements:
- id: OBS-26-01
  version: 0.1.0
  target: assess-service-health
  kind: functional
  category: functional
  mandatory: true
  status: specified
  priority: P0
  owner: observability-platform-owner
  statement: Users shall be able to determine whether observations are complete, sufficiently current, and fit for an intended decision.
  criteria:
  - 'Acceptance: A critical service view clearly indicates incomplete or outdated evidence.'
  - 'Negative: Evidence older than its agreed fitness threshold is labeled unfit for the decision.'
- id: OBS-26-02
  version: 0.1.0
  target: assess-service-health
  kind: non-functional
  category: observability
  mandatory: true
  status: specified
  priority: P0
  owner: observability-platform-owner
  statement: The system shall identify missing, inconsistent, and unexpectedly absent observations that could change service assessments.
  criteria:
  - 'Acceptance: A gap is surfaced as a data-quality issue instead of a healthy service.'
  - 'Negative: An expected source that stops reporting raises a data-quality issue within the agreed period.'
- id: OBS-26-03
  version: 0.1.0
  target: assess-service-health
  kind: functional
  category: functional
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Authorized users shall be able to identify the source, coverage and confidence limitations of evidence used in an investigation.
  criteria:
  - 'Acceptance: A reviewer traces a finding to its declared evidence source and qualifications.'
- id: OBS-26-04
  version: 0.1.0
  target: assess-service-health
  kind: functional
  category: semantic
  mandatory: true
  status: specified
  priority: P0
  owner: observability-platform-owner
  statement: The platform shall distinguish absence of failures from absence of information.
  criteria:
  - 'Acceptance: An interrupted observation source displays unknown or reduced confidence, never zero incidents by default.'
  - 'Negative: An interrupted source never yields zero incidents or healthy by default.'
- id: OBS-26-05
  version: 0.1.0
  target: assess-service-health
  kind: non-functional
  category: observability
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Service owners shall be able to review recurring data-quality issues and their business consequences.
  criteria:
  - 'Acceptance: A monthly review identifies unresolved quality issues and the services affected.'
- id: OBS-26-06
  version: 0.1.0
  target: assess-service-health
  kind: functional
  category: semantic
  mandatory: false
  status: specified
  priority: P1
  owner: observability-platform-owner
  statement: Users shall be able to tell when displayed results are based on sampled, aggregated or partial evidence and how this affects interpretation.
  criteria:
  - 'Acceptance: A rare-event count derived from sampled evidence is labeled as estimated.'
