requirements:
- id: OBS-21-01
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: The UI shall offer an organization-wide operational overview of critical services and active incidents.
  criteria:
  - id: acceptance
    text: 'Acceptance: An authorized duty manager can identify priority outages and affected services from one view.'
  - id: negative
    text: 'Negative: A critical service with unknown health is shown as unknown in the overview, not omitted.'
- id: OBS-21-02
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: Service owners shall have a service-focused view of health, reliability objectives, dependencies, and recent changes.
  criteria:
  - id: acceptance
    text: 'Acceptance: An owner can assess whether an individual service is meeting commitments.'
- id: OBS-21-03
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: Incident responders shall have a focused view of active issues, severity, ownership, impact, and next actions.
  criteria:
  - id: acceptance
    text: 'Acceptance: A responder can identify the currently assigned issue and its escalation route.'
  - id: negative
    text: 'Negative: An unassigned critical issue is highlighted as unassigned in the responder view.'
- id: OBS-21-04
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: Business stakeholders shall have an outcome-focused view of customer journeys and service impact without requiring telemetry expertise.
  criteria:
  - id: acceptance
    text: 'Acceptance: A business owner identifies a degraded journey and affected customer segment.'
- id: OBS-21-05
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: Authorized users shall be able to tailor dashboards to agreed operational questions and share them with permitted audiences.
  criteria:
  - id: acceptance
    text: 'Acceptance: Two teams can use different views of the same service without changing each other’s defaults.'
- id: OBS-21-06
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: Dashboards shall provide clear ownership, intended purpose, and last-revised information.
  criteria:
  - id: acceptance
    text: 'Acceptance: A reviewer identifies the accountable dashboard owner and whether the view is maintained.'
  depends_on:
  - OBS-34-01
- id: OBS-21-07
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: semantic
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: The UI shall distinguish live operational views from historical analytical reports.
  criteria:
  - id: acceptance
    text: 'Acceptance: A user can tell whether a displayed value is current, historical, or a scheduled report.'
- id: OBS-21-08
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: Users shall be able to move between a high-level operational summary and detailed evidence for the same subject.
  criteria:
  - id: acceptance
    text: 'Acceptance: A responder opens detailed evidence for a degraded service directly from its overview.'
  - id: negative
    text: 'Negative: A detailed view with unavailable evidence cannot imply that the service is healthy.'
  refines:
  - OBS-21-01
- id: OBS-21-09
  version: 0.1.0
  target: navigate-operational-workspaces-ui
  holder: platform
  kind: functional
  category: functional
  mandatory: false
  status: verified
  priority: P1
  owner: observability-platform-owner
  statement: The UI shall prioritize information relevant to the user role, active task and incident severity.
  criteria:
  - id: acceptance
    text: 'Acceptance: A duty manager sees current critical disruptions before low-priority historical analytics.'
  depends_on:
  - OBS-21-03
