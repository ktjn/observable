requirements:
- id: OBS-13-01
  version: 0.1.0
  target: report-service-status
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: Operational users shall have a consolidated view of their accountable services and active issues.
  criteria:
  - id: acceptance
    text: 'Acceptance: A user can see all currently critical issues for their area.'
  - id: negative
    text: 'Negative: A critical issue for an accountable service is not hidden by a personal filter.'
- id: OBS-13-02
  version: 0.1.0
  target: report-service-status
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: Users shall be able to inspect historical trends across an approved reporting period.
  criteria:
  - id: acceptance
    text: 'Acceptance: A monthly service review can be reproduced for a past period.'
  - id: negative
    text: 'Negative: A reproduced past report uses the data and definitions in force for that period.'
