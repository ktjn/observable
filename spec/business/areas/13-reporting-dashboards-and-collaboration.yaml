  version: 0.1.0
  target: report-service-status
  holder: platform
  kind: functional
  category: functional
  mandatory: true
  status: verified
  priority: P0
  owner: observability-platform-owner
  statement: Displayed results shall disclose the reporting period, scope, and freshness of information.
  criteria:
  - id: acceptance
    text: 'Acceptance: A reviewer can identify whether a chart is current, delayed, or partial.'
  - id: negative
    text: 'Negative: A partially loaded chart states that it is partial.'
