# yaml-language-server: $schema=../system-spec/reference-implementation/schema.json
system:
  id: observable-platform
  version: "0.1.0"
  status: specified
  layers:
    - experience
    - application
    - domain
    - infrastructure
  # Domains are logical responsibilities, orthogonal to layers (ADR-042).
  # incident-response must never use investigation: investigation already uses incident-response.
  domains:
    - id: operational-experience
      description: User-facing operational journeys and interaction contracts.
      uses: [investigation, service-model, service-assessment, service-control, incident-response, identity]
    - id: ingestion
      description: Telemetry admission and transport.
      uses: [identity, processing, service-control]
    - id: investigation
      description: Telemetry query and evidence exploration.
      uses: [identity, service-model, service-assessment, service-control, incident-response, telemetry-storage]
    - id: incident-response
      description: Detection, alerting, incidents, on-call and response coordination (observable-alerting; planned observable-response).
      # service-control: tenant purge requests are pulled from control.
      uses: [identity, service-model, service-assessment, service-control, telemetry-storage]
    - id: service-assessment
      description: Evaluated service health with evidence age, maintenance windows and unknown state (observable-health).
      uses: [identity, service-model, service-control, telemetry-storage]
    - id: service-model
      description: Business services, owners, criticality, coverage obligations and their mapping to telemetry service identities (observable-catalog).
      uses: [identity, service-control, telemetry-storage]
    - id: service-control
      description: Tenant configuration, dashboards, deployment markers and control-plane state.
      uses: [identity, telemetry-storage]
    - id: processing
      description: Telemetry transformation and normalization.
      uses: [telemetry-storage]
    - id: identity
      description: Authentication and authorization decisions.
    - id: telemetry-storage
      description: Durable telemetry persistence and retrieval contracts.
  release_scope: [P0]
  evidence_policy:
    require_criteria: true
  evidence_methods:
    platform: [test, analysis, inspection]
    process: [test, inspection]
    organization: [inspection]
  external_sources:
    - otel-collectors
    - oidc-idp
    - cicd-events
    - s3-object-storage
  quality_attributes:
    ingest_p99_ms: "<= 100"
    query_p99_ms: "<= 500"
    availability_target: "99.9%"

components:
  - id: observable-web
    version: "0.1.0"
    status: specified
    layer: experience
    domain: operational-experience
    consistency: strong
    source_paths:
      - apps/frontend
    provides:
      - explore-telemetry-ui
      - navigate-operational-workspaces-ui
      - interaction-states-ui
      - access-aware-ui
      - investigate-incidents-ui
    requires:
      - validate-credential@^0.1
      - manage-control-plane@^0.1
      - query-telemetry@^0.1
      - evaluate-alerts@^0.1
      - manage-service-catalog@^0.1
      - govern-observability-assets@^0.1
      - manage-providers@^0.1

  - id: observable-ingest
    version: "0.1.0"
    status: verified
    layer: application
    domain: ingestion
    consistency: eventual
    source_paths:
      - services/ingest-gateway
    provides:
      - ingest-otlp
    requires:
      - validate-credential@^0.1
      - normalize-telemetry@^0.1
      - publish-deployment-markers@^0.1

  - id: observable-query
    version: "0.1.0"
    status: specified
    layer: application
    domain: investigation
    consistency: strong
    source_paths:
      - services/query-api
      - libs/query-core
      - libs/domain-core
    provides:
      - query-telemetry
      - support-investigation
      - trace-transactions
      - assist-operations
      - observe-ai-services
    requires:
      - validate-credential@^0.1
      - manage-control-plane@^0.1
      - evaluate-alerts@^0.1
      - store-telemetry@^0.1
      # Phase 1 C4: service review composes the catalog record, health and approved objective
      # compliance with the caller's own credential (GET /v1/review/services).
      # Phase 2 E6: reviews and GET /v1/overview/services add freshness, issues and fitness;
      # GET /v1/platform/confidence composes the health and alerting self-statuses (internal
      # token) and the store-telemetry ingest watermark of the caller's tenant.
      - manage-service-catalog@^0.1
      - assess-service-health@^0.1
      - manage-reliability-objectives@^0.1

  - id: observable-control
    version: "0.1.0"
    status: specified
    layer: domain
    domain: service-control
    consistency: strong
    test_scope: integration
    source_paths:
      - services/admin-service
      - migrations/postgres/050_create_control_environment_classes.sql
      - migrations/postgres/065_create_control_tenant_purges.sql
    provides:
      - manage-control-plane
      - publish-deployment-markers
      - track-changes
      - report-service-status
      - report-observability-cost
    requires:
      - validate-credential@^0.1
      - store-telemetry@^0.1
    owns_data:
      - tenant-config
      - dashboard-model
      - deployment-marker
      - query-audit-entry

  - id: observable-alerting
    version: "0.1.0"
    status: specified
    layer: domain
    domain: incident-response
    consistency: strong
    test_scope: integration
    source_paths:
      - services/alert-evaluator
    provides:
      - evaluate-alerts
      - manage-reliability-objectives
      - manage-on-call
    requires:
      - validate-credential@^0.1
      - store-telemetry@^0.1
      # Phase 1 S6: rules and objectives are synced to the catalog asset registry.
      - govern-observability-assets@^0.1
      # Phase 1 C3: objectives bind to catalog services; reads forward the caller's credential.
      - manage-service-catalog@^0.1
      # Tenant purge: pulls purge requests from control (control cannot call alerting).
      - manage-control-plane@^0.1
    owns_data:
      - alert-rule
      - slo-definition
      - incident-record
      - service-objective

  # Phase 1 (docs/plans/phase1-service-catalog.md). S1 shipped the runtime skeleton, S3 the
  # service records behind manage-service-catalog, S4 journeys, scope and operating contexts
  # (environment classes read from manage-control-plane), S5 coverage and the asset registry
  # behind govern-observability-assets (signals read from store-telemetry), S6 the producers:
  # alerting pushes rules and objectives, and the catalog pulls control's dashboards through
  # manage-control-plane (control never calls the catalog, so the graph stays acyclic), S7
  # providers and dependencies behind manage-providers. S8 consumes the catalog from the web
  # and adds the versioned manage-service-catalog read mock and shared real/mock scenarios.
  - id: observable-catalog
    version: "0.1.0"
    status: specified
    layer: domain
    domain: service-model
    consistency: strong
    test_scope: integration
    source_paths:
      - services/catalog-service
      - migrations/postgres/046_create_catalog_schema.sql
      - migrations/postgres/048_create_catalog_service_records.sql
      - migrations/postgres/051_create_catalog_journeys.sql
      - migrations/postgres/053_create_catalog_coverage.sql
      - migrations/postgres/056_create_catalog_providers.sql
    test_paths:
      - services/catalog-service/tests
      - services/catalog-service/mocks
    standalone_harness: ["cargo", "test", "-p", "catalog-service", "--test", "http_probes_integration"]
    provided_mocks:
      manage-service-catalog:
        path: services/catalog-service/mocks/manage-service-catalog.v0.1.mjs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [visible_records, hidden_records, unavailable, delay]
    provides:
      - manage-service-catalog
      - govern-observability-assets
      - manage-providers
    requires:
      - validate-credential@^0.1
      - decide-access@^0.1
      - lookup-principals@^0.1
      - store-telemetry@^0.1
      - manage-control-plane@^0.1
    owns_data:
      - business-service
      - critical-journey
      - coverage-record
      - provider-record

  # C2.1 onboards probes and the schema role; C2.2 the worker ports; C2.3 evaluation,
  # scope-bound snapshots, the authorized read contract and the provider mock.
  - id: observable-health
    version: "0.1.0"
    status: specified
    layer: domain
    domain: service-assessment
    # Port tests read real ClickHouse (store-telemetry) through the read-only session.
    test_scope: integration
    source_paths:
      - services/health-service
      - migrations/postgres/058_create_health_schema.sql
      - migrations/postgres/061_create_health_assessments.sql
      - migrations/postgres/066_health_rule_revisions.sql
      - migrations/postgres/068_create_health_maintenance_windows.sql
      - migrations/postgres/070_create_health_transitions.sql
      - migrations/postgres/072_create_health_data_quality_issues.sql
    test_paths:
      - services/health-service/tests
      - services/health-service/mocks
      - apps/frontend/e2e/phase4-s1-service-performance.spec.ts
    standalone_harness: ["cargo", "test", "-p", "health-service", "--test", "http_probes_integration"]
    provided_mocks:
      assess-service-health:
        path: services/health-service/mocks/assess-service-health.v0.1.mjs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [fresh, stale, absent, restricted_service, restricted_contributor, retired, unavailable, delay]
    provides: [assess-service-health]
    # C2.2: the worker reads catalog inputs with a tenant-bound credential and evidence through
    # a read-only ClickHouse session. C2.3: reads authenticate the caller, authorize through
    # decide-access and the caller's own catalog read, and disclose scope-bound snapshots.
    # Phase 2 E1: threshold conditions over server spans and tenant rule revisions.
    # E2: maintenance windows with second-person approval. E3: transitions and history.
    # E4: data-quality issues and the internal worker self-status.
    requires:
      - validate-credential@^0.1
      - decide-access@^0.1
      - manage-service-catalog@^0.1
      - store-telemetry@^0.1
      # Tenant purge: pulls purge requests from control (control cannot call health).
      - manage-control-plane@^0.1
    owns_data:
      - health-assessment

  - id: observable-process
    version: "0.1.0"
    status: specified
    layer: domain
    domain: processing
    consistency: eventual
    source_paths:
      - services/stream-processor
      - libs/observable-process
    provides:
      - normalize-telemetry
    requires:
      - store-telemetry@^0.1

  - id: observable-auth
    version: "0.1.0"
    status: specified
    layer: infrastructure
    domain: identity
    consistency: strong
    source_paths:
      - services/auth-service
      - libs/observable-auth
      - migrations/postgres/059_create_health_worker_credentials.sql
      - migrations/postgres/060_authz_health_worker_role.sql
      - migrations/postgres/064_auth_purge_health_worker_credentials.sql
      - migrations/postgres/067_authz_grants_health_rule.sql
      - migrations/postgres/069_authz_grants_health_maintenance.sql
      - migrations/postgres/071_authz_grants_health_history.sql
      - migrations/postgres/073_authz_grants_health_issue.sql
    provides:
      - validate-credential
      - decide-access
      - lookup-principals
      - govern-data-access
      - audit-and-compliance
    # Provider-owned programmable mocks and the shared real/mock contract suite (ISO-03/04).
    # scripts/contract-suite.sh runs libs/observable-auth/tests/contract_mock.rs in mock mode and
    # services/auth-service/tests/authz_contract_integration.rs in real mode.
    provided_mocks:
      decide-access:
        path: libs/observable-auth/src/authz.rs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [policy, unavailable, delay]
      lookup-principals:
        path: libs/observable-auth/src/principals.rs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [directory, unavailable, delay]
    owns_data:
      - api-key-credential
      - user-session
      - health-worker-credential

  - id: observable-store-clickhouse
    version: "0.1.0"
    status: verified
    layer: infrastructure
    domain: telemetry-storage
    consistency: eventual
    source_paths:
      - services/storage-writer
      - migrations/clickhouse
      - libs/observable-storage-contracts
    provides:
      - store-telemetry
    owns_data:
      - span-row
      - log-row
      - metric-point

capabilities:
  - id: explore-telemetry-ui
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller holds an active user-session or public share token"
    postconditions:
      - "Renders tenant-scoped traces, logs, metrics, dashboards, and alerts"
    invariants:
      - "Never executes cross-tenant telemetry queries"
    failure_modes:
      - unauthenticated
      - upstream_unavailable
    interface:
      operation: GET /app/*
      mode: sync
      idempotent: true
      auth: oidc_session
      errors:
        unauthenticated: 401
        upstream_unavailable: 502

  - id: ingest-otlp
    version: "0.1.0"
    status: verified
    preconditions:
      - "Request carries a valid ingest api-key-credential with write scope"
      - "Payload conforms to OTLP v1 protobuf/JSON or deployment event schema"
    postconditions:
      - "Accepted telemetry batch is enqueued to bounded workers or published to Kafka raw topics"
    invariants:
      - "Tenant quota and rate limits are enforced prior to queue admission"
      - "Queue saturation returns 429/503 without silent drop"
    failure_modes:
      - invalid_api_key
      - quota_exceeded
      - payload_too_large
      - queue_full
    interface:
      operation: POST /v1/{traces,logs,metrics}
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      idempotent: false
      auth: bearer_api_key
      errors:
        invalid_api_key: 401
        quota_exceeded: 429
        payload_too_large: 413
        queue_full: 503

  - id: query-telemetry
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller presents a valid session JWT or read-scoped API key"
      - "Time window and limit parameters are within configured guardrails"
    postconditions:
      - "Returns tenant-isolated telemetry rows, aggregations, or service dependency graphs"
    invariants:
      - "Every analytical query binds tenant_id as a mandatory predicate"
    failure_modes:
      - unauthorized
      - invalid_query_window
      - storage_timeout
    interface:
      operation: GET /api/v1/query/*
      mode: sync
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: jwt_or_api_key
      errors:
        unauthorized: 401
        invalid_query_window: 400
        storage_timeout: 504

  - id: manage-control-plane
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller holds a validated session or admin token for the target tenant"
    postconditions:
      - "Control-plane metadata is persisted atomically in control.* PostgreSQL tables"
    invariants:
      - "Tenant configuration and dashboard ownership remain isolated per tenant_id"
    failure_modes:
      - unauthorized
      - tenant_not_found
      - validation_error
    interface:
      operation: /api/v1/admin/*
      mode: sync
      request: tenant-config
      response: dashboard-model
      idempotent: true
      auth: jwt_or_api_key
      errors:
        unauthorized: 401
        tenant_not_found: 404
        validation_error: 422

  - id: publish-deployment-markers
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller provides a valid tenant-scoped marker payload from ingest or control API"
    postconditions:
      - "Deployment marker is persisted for timeline and correlation overlays"
    invariants:
      - "Markers are immutable once recorded for a given tenant, service, and revision"
    failure_modes:
      - unauthorized
      - invalid_marker_payload
    interface:
      operation: POST /internal/deployments
      mode: sync
      request: deployment-marker
      response: deployment-marker
      idempotent: true
      auth: internal_service_token
      errors:
        unauthorized: 401
        invalid_marker_payload: 400

  - id: evaluate-alerts
    version: "0.1.0"
    status: specified
    preconditions:
      - "Alert rule and SLO definitions belong to an active tenant"
    postconditions:
      - "Rule state transitions and incident correlation snapshots are persisted in alerting.* tables"
    invariants:
      - "Alert evaluations are strictly scoped to the rule's tenant_id"
    failure_modes:
      - unauthorized
      - evaluation_timeout
      - rule_not_found
    interface:
      operation: /api/v1/alerts/*
      mode: sync
      request: alert-rule
      response: incident-record
      idempotent: true
      auth: jwt_or_service_token
      errors:
        unauthorized: 401
        evaluation_timeout: 504
        rule_not_found: 404

  - id: normalize-telemetry
    version: "0.1.0"
    status: specified
    preconditions:
      - "Input record conforms to telemetry.raw.v1 envelope with tenant_id"
    postconditions:
      - "Scrubbed, schema-normalized records are published to telemetry.normalized.v1 or DLQ"
    invariants:
      - "PII scrubbing rules execute before any normalized record leaves the processor"
    failure_modes:
      - malformed_envelope
      - dlq_publish_failed
    interface:
      operation: telemetry.raw.v1 -> telemetry.normalized.v1
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: sasl_scram
      errors:
        malformed_envelope: dlq_routed
        dlq_publish_failed: retry_backoff

  - id: store-telemetry
    version: "0.1.0"
    status: verified
    preconditions:
      - "Records carry a valid tenant_id and conform to normalized ClickHouse table schemas"
    postconditions:
      - "Batches are flushed to ClickHouse MergeTree tables before Kafka offsets are committed"
    invariants:
      - "No acknowledged batch is silently lost before durable ClickHouse write"
    failure_modes:
      - clickhouse_write_failed
      - schema_mismatch
    interface:
      operation: consume telemetry.normalized.v1 / SELECT spans,logs,metric_points
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: clickhouse_credentials
      errors:
        clickhouse_write_failed: 503
        schema_mismatch: 422

  - id: validate-credential
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller supplies a bearer API key or session token over HTTP"
    postconditions:
      - "Returns verified PrincipalContext with tenant_id, role, and scopes or 401/403"
      - "Health worker validation accepts only an active dedicated credential for the requested tenant"
    invariants:
      - "Plaintext API keys are never persisted; lookup uses SHA-256 key_hash"
      - "Health worker credentials are hash-only and are separate from ingestion keys and user sessions"
    failure_modes:
      - invalid_credential
      - expired_credential
      - insufficient_scope
    interface:
      operation: POST /internal/auth/validate, POST /internal/health-worker/validate
      mode: sync
      request: api-key-credential
      response: user-session
      idempotent: true
      auth: internal_service_token
      errors:
        invalid_credential: 401
        expired_credential: 401
        insufficient_scope: 403

  # Policy decision point contract (ADR-041), implemented in phase 1 S2 over the PostgreSQL policy
  # store (migration 047). Two operations: decide (one resource) and filter (list subset). The
  # contract was never released, so filter extends 0.1.0 instead of bumping it.
  - id: decide-access
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller presents a verified principal, tenant, resource reference, action and, where required, a stated purpose and elevation grant"
    postconditions:
      - "Returns permit or deny for the resource and action, and records actor, purpose, elevation and decision"
      - "Filter returns only the permitted subset of the requested resources"
    invariants:
      - "A denied resource and a non-existent resource produce the same response"
      - "An undecidable request is denied (fail closed)"
      - "List decisions filter before counting, so restricted records are never returned or counted"
    failure_modes:
      - access_denied
      - purpose_missing
      - elevation_expired
      - decision_unavailable
    interface:
      operation: POST /internal/authz/decide, POST /internal/authz/filter
      mode: sync
      idempotent: true
      auth: internal_service_token
      errors:
        access_denied: 403
        purpose_missing: 422
        elevation_expired: 403
        decision_unavailable: 503

  # Principal directory for ownership checks (owner left, OBS-02-02); phase 1 S2.
  - id: lookup-principals
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller names a tenant and up to 500 user principal identifiers"
    postconditions:
      - "Returns one state per distinct principal: active (role in the tenant), departed (known user without a role in the tenant) or unknown"
    invariants:
      - "Membership is evaluated per tenant only"
    failure_modes:
      - principal_unknown
      - directory_unavailable
    interface:
      operation: POST /internal/principals/resolve
      mode: sync
      idempotent: true
      auth: internal_service_token
      errors:
        principal_unknown: "state unknown in response"
        directory_unavailable: 503

data_models:
  - id: span-row
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: confidential
    external_source: otel-collectors
    schema_path: models/tracing.mdl
    fields:
      tenant_id: string
      trace_id: string
      span_id: string
      service_name: string
      operation_name: string
      start_time_ns: int64
      duration_ns: int64
      status_code: string
      attributes: map<string,string>

  - id: log-row
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: confidential
    external_source: otel-collectors
    schema_path: models/logs.mdl
    fields:
      tenant_id: string
      timestamp_ns: int64
      trace_id: string
      span_id: string
      severity_number: uint8
      body: string
      attributes: map<string,string>

  - id: metric-point
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: internal
    derived_from:
      - span-row
    declassified_by: req-pii-scrubbing
    schema_path: models/metrics.mdl
    fields:
      tenant_id: string
      metric_name: string
      timestamp_ns: int64
      value: float64
      labels: map<string,string>

  - id: tenant-config
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    external_source: oidc-idp
    schema_path: models/admin.mdl
    fields:
      tenant_id: uuid
      slug: string
      retention_days: uint16
      ingest_quota_per_sec: uint32
      environment_classes: map<string,string>

  - id: dashboard-model
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/dashboards.mdl
    fields:
      dashboard_id: uuid
      tenant_id: uuid
      title: string
      layout_json: string

  - id: deployment-marker
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    external_source: cicd-events
    schema_path: models/admin.mdl
    fields:
      marker_id: uuid
      tenant_id: uuid
      service_name: string
      version: string
      deployed_at: timestamp

  - id: query-audit-entry
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/admin.mdl
    fields:
      id: uuid
      tenant_id: uuid
      action: string
      result_count: int64
      occurred_at: timestamp

  - id: alert-rule
    version: "0.1.0"
    owner: observable-alerting
    namespace: alerting
    storage_role: observable_alerting_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/alerts.mdl
    fields:
      rule_id: uuid
      tenant_id: uuid
      name: string
      query_expr: string
      threshold: float64
      window_sec: uint32
      owner_kind: string
      owner_id: uuid

  - id: service-objective
    version: "0.1.0"
    owner: observable-alerting
    namespace: alerting
    storage_role: observable_alerting_role
    classification: internal
    schema_path: migrations/postgres/063_create_alerting_service_objectives.sql
    fields:
      objective_id: uuid
      tenant_id: uuid
      service_id: uuid
      environment_class: string
      sli_type: string
      target: float64
      window_days: integer
      at_risk_budget_fraction: float64
      freshness_seconds: integer
      approved_by: nullable<uuid>
