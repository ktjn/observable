# yaml-language-server: $schema=../system-spec/reference-implementation/schema.json
system:
  id: observable-platform
  version: "0.1.0"
  status: specified
  layers:
    - experience
    - application
    - domain
    - infrastructure
  # Domains are logical responsibilities, orthogonal to layers (ADR-042). service-assessment is
  # declared ahead of its planned provider (observable-health). ADR-039 brings forward
  # the health work needed for Phase 1 exit before the remaining Phase 2 work.
  # incident-response must never use investigation: investigation already uses incident-response.
  domains:
    - id: operational-experience
      description: User-facing operational journeys and interaction contracts.
      uses: [investigation, service-model, service-assessment, service-control, incident-response, identity]
    - id: ingestion
      description: Telemetry admission and transport.
      uses: [identity, processing, service-control]
    - id: investigation
      description: Telemetry query and evidence exploration.
      uses: [identity, service-model, service-assessment, service-control, incident-response, telemetry-storage]
    - id: incident-response
      description: Detection, alerting, incidents, on-call and response coordination (observable-alerting; planned observable-response).
      uses: [identity, service-model, service-assessment, telemetry-storage]
    - id: service-assessment
      description: Evaluated service health with evidence age, maintenance windows and unknown state (planned observable-health).
      uses: [identity, service-model, telemetry-storage]
    - id: service-model
      description: Business services, owners, criticality, coverage obligations and their mapping to telemetry service identities (observable-catalog).
      uses: [identity, service-control, telemetry-storage]
    - id: service-control
      description: Tenant configuration, dashboards, deployment markers and control-plane state.
      uses: [identity, telemetry-storage]
    - id: processing
      description: Telemetry transformation and normalization.
      uses: [telemetry-storage]
    - id: identity
      description: Authentication and authorization decisions.
    - id: telemetry-storage
      description: Durable telemetry persistence and retrieval contracts.
  external_sources:
    - otel-collectors
    - oidc-idp
    - cicd-events
    - s3-object-storage
  quality_attributes:
    ingest_p99_ms: "<= 100"
    query_p99_ms: "<= 500"
    availability_target: "99.9%"

components:
  - id: observable-web
    version: "0.1.0"
    status: specified
    layer: experience
    domain: operational-experience
    consistency: strong
    source_paths:
      - apps/frontend
    provides:
      - explore-telemetry-ui
      - navigate-operational-workspaces-ui
      - interaction-states-ui
      - access-aware-ui
      - investigate-incidents-ui
    requires:
      - validate-credential@^0.1
      - manage-control-plane@^0.1
      - query-telemetry@^0.1
      - evaluate-alerts@^0.1
      - manage-service-catalog@^0.1
      - govern-observability-assets@^0.1
      - manage-providers@^0.1

  - id: observable-ingest
    version: "0.1.0"
    status: verified
    layer: application
    domain: ingestion
    consistency: eventual
    source_paths:
      - services/ingest-gateway
    provides:
      - ingest-otlp
    requires:
      - validate-credential@^0.1
      - normalize-telemetry@^0.1
      - publish-deployment-markers@^0.1

  - id: observable-query
    version: "0.1.0"
    status: specified
    layer: application
    domain: investigation
    consistency: strong
    source_paths:
      - services/query-api
      - libs/query-core
      - libs/domain-core
    provides:
      - query-telemetry
      - support-investigation
      - trace-transactions
      - assist-operations
      - observe-ai-services
    requires:
      - validate-credential@^0.1
      - manage-control-plane@^0.1
      - evaluate-alerts@^0.1
      - store-telemetry@^0.1

  - id: observable-control
    version: "0.1.0"
    status: specified
    layer: domain
    domain: service-control
    consistency: strong
    test_scope: integration
    source_paths:
      - services/admin-service
      - migrations/postgres/050_create_control_environment_classes.sql
    provides:
      - manage-control-plane
      - publish-deployment-markers
      - track-changes
      - report-service-status
      - report-observability-cost
    requires:
      - validate-credential@^0.1
      - store-telemetry@^0.1
    owns_data:
      - tenant-config
      - dashboard-model
      - deployment-marker
      - query-audit-entry

  - id: observable-alerting
    version: "0.1.0"
    status: specified
    layer: domain
    domain: incident-response
    consistency: strong
    test_scope: integration
    source_paths:
      - services/alert-evaluator
    provides:
      - evaluate-alerts
      - manage-reliability-objectives
      - manage-on-call
    requires:
      - validate-credential@^0.1
      - store-telemetry@^0.1
      # Phase 1 S6: rules and objectives are synced to the catalog asset registry.
      - govern-observability-assets@^0.1
    owns_data:
      - alert-rule
      - slo-definition
      - incident-record

  # Phase 1 (docs/plans/phase1-service-catalog.md). S1 shipped the runtime skeleton, S3 the
  # service records behind manage-service-catalog, S4 journeys, scope and operating contexts
  # (environment classes read from manage-control-plane), S5 coverage and the asset registry
  # behind govern-observability-assets (signals read from store-telemetry), S6 the producers:
  # alerting pushes rules and objectives, and the catalog pulls control's dashboards through
  # manage-control-plane (control never calls the catalog, so the graph stays acyclic), S7
  # providers and dependencies behind manage-providers. S8 consumes the catalog from the web
  # and adds the versioned manage-service-catalog read mock and shared real/mock scenarios.
  - id: observable-catalog
    version: "0.1.0"
    status: specified
    layer: domain
    domain: service-model
    consistency: strong
    test_scope: integration
    source_paths:
      - services/catalog-service
      - migrations/postgres/046_create_catalog_schema.sql
      - migrations/postgres/048_create_catalog_service_records.sql
      - migrations/postgres/051_create_catalog_journeys.sql
      - migrations/postgres/053_create_catalog_coverage.sql
      - migrations/postgres/056_create_catalog_providers.sql
    test_paths:
      - services/catalog-service/tests
      - services/catalog-service/mocks
    standalone_harness: ["cargo", "test", "-p", "catalog-service", "--test", "http_probes_integration"]
    provided_mocks:
      manage-service-catalog:
        path: services/catalog-service/mocks/manage-service-catalog.v0.1.mjs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [visible_records, hidden_records, unavailable, delay]
    provides:
      - manage-service-catalog
      - govern-observability-assets
      - manage-providers
    requires:
      - validate-credential@^0.1
      - decide-access@^0.1
      - lookup-principals@^0.1
      - store-telemetry@^0.1
      - manage-control-plane@^0.1
    owns_data:
      - business-service
      - critical-journey
      - coverage-record
      - provider-record

  - id: observable-process
    version: "0.1.0"
    status: specified
    layer: domain
    domain: processing
    consistency: eventual
    source_paths:
      - services/stream-processor
      - libs/observable-process
    provides:
      - normalize-telemetry
    requires:
      - store-telemetry@^0.1

  - id: observable-auth
    version: "0.1.0"
    status: specified
    layer: infrastructure
    domain: identity
    consistency: strong
    source_paths:
      - services/auth-service
      - libs/observable-auth
    provides:
      - validate-credential
      - decide-access
      - lookup-principals
      - govern-data-access
      - audit-and-compliance
    # Provider-owned programmable mocks and the shared real/mock contract suite (ISO-03/04).
    # scripts/contract-suite.sh runs libs/observable-auth/tests/contract_mock.rs in mock mode and
    # services/auth-service/tests/authz_contract_integration.rs in real mode.
    provided_mocks:
      decide-access:
        path: libs/observable-auth/src/authz.rs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [policy, unavailable, delay]
      lookup-principals:
        path: libs/observable-auth/src/principals.rs
        contract_suite: ["bash", "scripts/contract-suite.sh"]
        scenarios: [directory, unavailable, delay]
    owns_data:
      - api-key-credential
      - user-session

  - id: observable-store-clickhouse
    version: "0.1.0"
    status: verified
    layer: infrastructure
    domain: telemetry-storage
    consistency: eventual
    source_paths:
      - services/storage-writer
      - migrations/clickhouse
      - libs/observable-storage-contracts
    provides:
      - store-telemetry
    owns_data:
      - span-row
      - log-row
      - metric-point

capabilities:
  - id: explore-telemetry-ui
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller holds an active user-session or public share token"
    postconditions:
      - "Renders tenant-scoped traces, logs, metrics, dashboards, and alerts"
    invariants:
      - "Never executes cross-tenant telemetry queries"
    failure_modes:
      - unauthenticated
      - upstream_unavailable
    interface:
      operation: GET /app/*
      mode: sync
      idempotent: true
      auth: oidc_session
      errors:
        unauthenticated: 401
        upstream_unavailable: 502

  - id: ingest-otlp
    version: "0.1.0"
    status: verified
    preconditions:
      - "Request carries a valid ingest api-key-credential with write scope"
      - "Payload conforms to OTLP v1 protobuf/JSON or deployment event schema"
    postconditions:
      - "Accepted telemetry batch is enqueued to bounded workers or published to Kafka raw topics"
    invariants:
      - "Tenant quota and rate limits are enforced prior to queue admission"
      - "Queue saturation returns 429/503 without silent drop"
    failure_modes:
      - invalid_api_key
      - quota_exceeded
      - payload_too_large
      - queue_full
    interface:
      operation: POST /v1/{traces,logs,metrics}
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      idempotent: false
      auth: bearer_api_key
      errors:
        invalid_api_key: 401
        quota_exceeded: 429
        payload_too_large: 413
        queue_full: 503

  - id: query-telemetry
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller presents a valid session JWT or read-scoped API key"
      - "Time window and limit parameters are within configured guardrails"
    postconditions:
      - "Returns tenant-isolated telemetry rows, aggregations, or service dependency graphs"
    invariants:
      - "Every analytical query binds tenant_id as a mandatory predicate"
    failure_modes:
      - unauthorized
      - invalid_query_window
      - storage_timeout
    interface:
      operation: GET /api/v1/query/*
      mode: sync
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: jwt_or_api_key
      errors:
        unauthorized: 401
        invalid_query_window: 400
        storage_timeout: 504

  - id: manage-control-plane
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller holds a validated session or admin token for the target tenant"
    postconditions:
      - "Control-plane metadata is persisted atomically in control.* PostgreSQL tables"
    invariants:
      - "Tenant configuration and dashboard ownership remain isolated per tenant_id"
    failure_modes:
      - unauthorized
      - tenant_not_found
      - validation_error
    interface:
      operation: /api/v1/admin/*
      mode: sync
      request: tenant-config
      response: dashboard-model
      idempotent: true
      auth: jwt_or_api_key
      errors:
        unauthorized: 401
        tenant_not_found: 404
        validation_error: 422

  - id: publish-deployment-markers
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller provides a valid tenant-scoped marker payload from ingest or control API"
    postconditions:
      - "Deployment marker is persisted for timeline and correlation overlays"
    invariants:
      - "Markers are immutable once recorded for a given tenant, service, and revision"
    failure_modes:
      - unauthorized
      - invalid_marker_payload
    interface:
      operation: POST /internal/deployments
      mode: sync
      request: deployment-marker
      response: deployment-marker
      idempotent: true
      auth: internal_service_token
      errors:
        unauthorized: 401
        invalid_marker_payload: 400

  - id: evaluate-alerts
    version: "0.1.0"
    status: specified
    preconditions:
      - "Alert rule and SLO definitions belong to an active tenant"
    postconditions:
      - "Rule state transitions and incident correlation snapshots are persisted in alerting.* tables"
    invariants:
      - "Alert evaluations are strictly scoped to the rule's tenant_id"
    failure_modes:
      - unauthorized
      - evaluation_timeout
      - rule_not_found
    interface:
      operation: /api/v1/alerts/*
      mode: sync
      request: alert-rule
      response: incident-record
      idempotent: true
      auth: jwt_or_service_token
      errors:
        unauthorized: 401
        evaluation_timeout: 504
        rule_not_found: 404

  - id: normalize-telemetry
    version: "0.1.0"
    status: specified
    preconditions:
      - "Input record conforms to telemetry.raw.v1 envelope with tenant_id"
    postconditions:
      - "Scrubbed, schema-normalized records are published to telemetry.normalized.v1 or DLQ"
    invariants:
      - "PII scrubbing rules execute before any normalized record leaves the processor"
    failure_modes:
      - malformed_envelope
      - dlq_publish_failed
    interface:
      operation: telemetry.raw.v1 -> telemetry.normalized.v1
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: sasl_scram
      errors:
        malformed_envelope: dlq_routed
        dlq_publish_failed: retry_backoff

  - id: store-telemetry
    version: "0.1.0"
    status: verified
    preconditions:
      - "Records carry a valid tenant_id and conform to normalized ClickHouse table schemas"
    postconditions:
      - "Batches are flushed to ClickHouse MergeTree tables before Kafka offsets are committed"
    invariants:
      - "No acknowledged batch is silently lost before durable ClickHouse write"
    failure_modes:
      - clickhouse_write_failed
      - schema_mismatch
    interface:
      operation: consume telemetry.normalized.v1 / SELECT spans,logs,metric_points
      mode: async
      request:
        - span-row
        - log-row
        - metric-point
      response:
        - span-row
        - log-row
        - metric-point
      idempotent: true
      auth: clickhouse_credentials
      errors:
        clickhouse_write_failed: 503
        schema_mismatch: 422

  - id: validate-credential
    version: "0.1.0"
    status: verified
    preconditions:
      - "Caller supplies a bearer API key or session token over HTTP"
    postconditions:
      - "Returns verified PrincipalContext with tenant_id, role, and scopes or 401/403"
    invariants:
      - "Plaintext API keys are never persisted; lookup uses SHA-256 key_hash"
    failure_modes:
      - invalid_credential
      - expired_credential
      - insufficient_scope
    interface:
      operation: POST /internal/auth/validate
      mode: sync
      request: api-key-credential
      response: user-session
      idempotent: true
      auth: internal_service_token
      errors:
        invalid_credential: 401
        expired_credential: 401
        insufficient_scope: 403

  # Policy decision point contract (ADR-041), implemented in phase 1 S2 over the PostgreSQL policy
  # store (migration 047). Two operations: decide (one resource) and filter (list subset). The
  # contract was never released, so filter extends 0.1.0 instead of bumping it.
  - id: decide-access
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller presents a verified principal, tenant, resource reference, action and, where required, a stated purpose and elevation grant"
    postconditions:
      - "Returns permit or deny for the resource and action, and records actor, purpose, elevation and decision"
      - "Filter returns only the permitted subset of the requested resources"
    invariants:
      - "A denied resource and a non-existent resource produce the same response"
      - "An undecidable request is denied (fail closed)"
      - "List decisions filter before counting, so restricted records are never returned or counted"
    failure_modes:
      - access_denied
      - purpose_missing
      - elevation_expired
      - decision_unavailable
    interface:
      operation: POST /internal/authz/decide, POST /internal/authz/filter
      mode: sync
      idempotent: true
      auth: internal_service_token
      errors:
        access_denied: 403
        purpose_missing: 422
        elevation_expired: 403
        decision_unavailable: 503

  # Principal directory for ownership checks (owner left, OBS-02-02); phase 1 S2.
  - id: lookup-principals
    version: "0.1.0"
    status: specified
    preconditions:
      - "Caller names a tenant and up to 500 user principal identifiers"
    postconditions:
      - "Returns one state per distinct principal: active (role in the tenant), departed (known user without a role in the tenant) or unknown"
    invariants:
      - "Membership is evaluated per tenant only"
    failure_modes:
      - principal_unknown
      - directory_unavailable
    interface:
      operation: POST /internal/principals/resolve
      mode: sync
      idempotent: true
      auth: internal_service_token
      errors:
        principal_unknown: "state unknown in response"
        directory_unavailable: 503

data_models:
  - id: span-row
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: confidential
    external_source: otel-collectors
    schema_path: models/tracing.mdl
    fields:
      tenant_id: string
      trace_id: string
      span_id: string
      service_name: string
      operation_name: string
      start_time_ns: int64
      duration_ns: int64
      status_code: string
      attributes: map<string,string>

  - id: log-row
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: confidential
    external_source: otel-collectors
    schema_path: models/logs.mdl
    fields:
      tenant_id: string
      timestamp_ns: int64
      trace_id: string
      span_id: string
      severity_number: uint8
      body: string
      attributes: map<string,string>

  - id: metric-point
    version: "0.1.0"
    owner: observable-store-clickhouse
    namespace: observable
    classification: internal
    derived_from:
      - span-row
    declassified_by: req-pii-scrubbing
    schema_path: models/metrics.mdl
    fields:
      tenant_id: string
      metric_name: string
      timestamp_ns: int64
      value: float64
      labels: map<string,string>

  - id: tenant-config
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    external_source: oidc-idp
    schema_path: models/admin.mdl
    fields:
      tenant_id: uuid
      slug: string
      retention_days: uint16
      ingest_quota_per_sec: uint32
      environment_classes: map<string,string>

  - id: dashboard-model
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/dashboards.mdl
    fields:
      dashboard_id: uuid
      tenant_id: uuid
      title: string
      layout_json: string

  - id: deployment-marker
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    external_source: cicd-events
    schema_path: models/admin.mdl
    fields:
      marker_id: uuid
      tenant_id: uuid
      service_name: string
      version: string
      deployed_at: timestamp

  - id: query-audit-entry
    version: "0.1.0"
    owner: observable-control
    namespace: control
    storage_role: observable_control_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/admin.mdl
    fields:
      id: uuid
      tenant_id: uuid
      action: string
      result_count: int64
      occurred_at: timestamp

  - id: alert-rule
    version: "0.1.0"
    owner: observable-alerting
    namespace: alerting
    storage_role: observable_alerting_role
    classification: internal
    derived_from:
      - tenant-config
    schema_path: models/alerts.mdl
    fields:
      rule_id: uuid
      tenant_id: uuid
      name: string
      query_expr: string
      threshold: float64
      window_sec: uint32
      owner_kind: string
      owner_id: uuid

  - id: slo-definition
    version: "0.1.0"
    owner: observable-alerting
    namespace: alerting
    storage_role: observable_alerting_role
    classification: internal
    derived_from:
      - metric-point
    schema_path: models/slos.mdl
    fields:
      slo_id: uuid
      tenant_id: uuid
      service_name: string
      target_percentage: float64
      window_days: uint16
      owner_kind: string
      owner_id: uuid

  - id: incident-record
    version: "0.1.0"
    owner: observable-alerting
    namespace: alerting
    storage_role: observable_alerting_role
    classification: confidential
    derived_from:
      - alert-rule
      - span-row
    schema_path: models/incidents.mdl
    fields:
      incident_id: uuid
      tenant_id: uuid
      rule_id: uuid
      state: string
      opened_at: timestamp

  # Phase 1 S3: catalog service record (migration 048). Owners, aliases, teams and outcomes are
  # child tables of the same aggregate in the catalog schema.
  - id: business-service
    version: "0.1.0"
    owner: observable-catalog
    namespace: catalog
    storage_role: observable_catalog_role
    classification: internal
    schema_path: models/catalog.mdl
    fields:
      id: uuid
      tenant_id: uuid
      business_name: string
      operational_name: string
      domain: string
      criticality: string
      lifecycle: string
      classification: string
      support_route: string
      aliases: list<string>

  # Phase 1 S4: critical customer journey (migration 051), ordered service links in
  # catalog.journey_services.
  - id: critical-journey
    version: "0.1.0"
    owner: observable-catalog
    namespace: catalog
    storage_role: observable_catalog_role
    classification: internal
    schema_path: models/catalog.mdl
    fields:
      id: uuid
      tenant_id: uuid
      name: string
      criticality: string
      in_scope: bool
      scope_rationale: string
      classification: string
      owner_kind: string
      owner_id: uuid
      service_ids: list<uuid>

  # Phase 1 S5 (migration 053): the coverage record of a tenant: policies per criticality,
  # bindings, registered observability assets, claims, assessment results and gaps. Assets were
  # folded in during S7 so the catalog stays within four owned data models (COMP-03).
  - id: coverage-record
    version: "0.1.0"
    owner: observable-catalog
    namespace: catalog
    storage_role: observable_catalog_role
    classification: internal
    schema_path: models/catalog.mdl
    fields:
      tenant_id: uuid
      policy_criticality: string
      policy_items: list<string>
      policy_window_minutes: int32
      policy_approved_by: uuid
      coverage_status: string
      assessed_at: timestamp
      gap_id: uuid
      service_id: uuid
      journey_id: uuid
      item: string
      gap_state: string
      remediation_owner_id: uuid
      due_date: date
      review_date: date
      acceptance_approver: uuid
      acceptance_rationale: string
      asset_kind: string
      asset_external_id: string
      asset_owning_component: string
      asset_owner_kind: string
      asset_owner_id: uuid

  # Phase 1 S7 (migration 056): material providers and the service or journey functions that
  # depend on them; a dependency may name a provider that is not registered yet.
  - id: provider-record
    version: "0.1.0"
    owner: observable-catalog
    namespace: catalog
    storage_role: observable_catalog_role
    classification: internal
    schema_path: models/catalog.mdl
    fields:
      id: uuid
      tenant_id: uuid
      name: string
      kind: string
      material: bool
      contract_ref: string
      contract_owner_kind: string
      contract_owner_id: uuid
      classification: string
      dependency_id: uuid
      dependency_provider_name: string
      dependency_service_id: uuid
      dependency_journey_id: uuid
      dependency_function: string

  - id: api-key-credential
    version: "0.1.0"
    owner: observable-auth
    namespace: auth
    storage_role: observable_auth_role
    classification: restricted
    external_source: oidc-idp
    schema_path: models/admin.mdl
    fields:
      key_id: uuid
      tenant_id: uuid
      key_prefix: string
      key_hash_sha256: string
      scopes: list<string>

  - id: user-session
    version: "0.1.0"
