requirements:
  - id: req-ui-tenant-session
    version: "0.1.0"
    target: explore-telemetry-ui
    status: verified
    kind: functional
    category: functional
    mandatory: true
    criteria:
      - "Unauthenticated browser sessions are redirected to OIDC login unless accessing a valid share token"
      - "All UI telemetry queries bind the active session tenant_id"

  - id: req-ingest-delivery
    version: "0.1.0"
    target: ingest-otlp
    status: specified
    kind: functional
    category: functional
    mandatory: true
    criteria:
      - "When bounded queues are full, ingest returns 429/503 backpressure without silent drop"
      - "Every accepted OTLP item reaches stored ClickHouse state or the dead-letter queue"

  - id: req-ingest-rate-limit
    version: "0.1.0"
    target: ingest-otlp
    status: verified
    kind: functional
    category: functional
    mandatory: false
    criteria:
      - "Trace, log and metric ingest over OTLP HTTP, OTLP gRPC and Prometheus Remote Write apply a per-tenant, per-signal request rate limit"
      - "A request over the limit is rejected with HTTP 429 and Retry-After: 1, or gRPC ResourceExhausted, and counted in ingest_gateway_rejections_total with reason rate_limit_exceeded"
      - "One tenant exhausting its limit does not consume another tenant's quota"

  - id: req-ingest-cardinality-budget
    version: "0.1.0"
    target: ingest-otlp
    status: verified
    kind: functional
    category: functional
    mandatory: false
    criteria:
      - "When METRIC_CARDINALITY_ENFORCE is true, a metrics request that would take a tenant's cumulative submitted series count over its budget is rejected with HTTP 429 and Retry-After: 60, or gRPC ResourceExhausted, and counted in ingest_gateway_rejections_total with reason cardinality_budget_exceeded"
      - "When enforcement is off, the budget is only observed and requests are accepted"

  - id: req-deployment-marker-immutability
    version: "0.1.0"
    target: publish-deployment-markers
    status: verified
    kind: functional
    category: functional
    mandatory: true
    criteria:
      - "Recorded deployment markers for a (tenant_id, service_name, version) tuple are persisted and queryable for timeline overlays"

  - id: req-pii-scrubbing
    version: "0.2.0"
    target: normalize-telemetry
    status: verified
    kind: functional
    category: semantic
    mandatory: true
    criteria:
      - "Derived metric-point aggregations contain no raw PII attributes, authorizing internal classification"

  - id: req-component-compat
    version: "0.1.0"
    target: observable-platform
    status: specified
    kind: functional
    category: contract
    mandatory: true
    criteria:
      - "scripts/check-component-boundaries.sh reports zero cross-component source imports (0 allowlisted couplings)"
      - "TLC model checking of ComponentCompatibility.tla verifies all 8 components satisfy SemVer requires ranges"

  - id: req-otlp-envelope-serde
    version: "0.1.0"
    target: store-telemetry
    status: verified
    kind: functional
    category: serialization
    mandatory: true
    criteria:
      - "Raw and normalized telemetry envelopes and models/*.mdl schemas preserve field types and tenant_id across round-trip serialization"

  - id: req-bounded-worker-concurrency
    version: "0.1.0"
    target: ingest-otlp
    status: verified
    kind: functional
    category: concurrency
    mandatory: true
    criteria:
      - "TelemetryDelivery.tla verifies BoundedQueues and terminal progress across all reachable states without deadlock"

  - id: req-query-latency
    version: "0.1.0"
    target: query-telemetry
    status: specified
    kind: non-functional
    category: performance
    mandatory: true
    criteria:
      - "Tenant-scoped trace, log, and metric queries over a 1-hour window complete within p99 <= 500ms"

  - id: req-ingest-throughput
    version: "0.1.0"
    target: ingest-otlp
    status: specified
    kind: non-functional
    category: scalability
    mandatory: true
    criteria:
      - "observable-ingest and observable-process sustain 10,000 spans/sec per replica with horizontal partition scaling"

  - id: req-backpressure-resilience
    version: "0.1.0"
    target: store-telemetry
    status: verified
    kind: non-functional
    category: resilience
    mandatory: true
    criteria:
      - "observable-store-clickhouse withholds Kafka offset commits until ClickHouse batch insert succeeds and retries transient failures with backoff"

  - id: req-tenant-auth-isolation
    version: "0.1.0"
    target: validate-credential
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    criteria:
      - "observable-auth verifies SHA-256 API key hashes and rejects invalid, expired, or cross-tenant credentials with 401/403"

  - id: req-self-observability
    version: "0.2.0"
    target: observable-platform
    status: verified
    kind: non-functional
    category: observability
    mandatory: true
    criteria:
      - "All deployable backend services expose /health, /readyz and a Prometheus /metrics endpoint; /readyz returns 503 when a required dependency is unavailable"

  - id: req-dedup-idempotency
    version: "0.1.0"
    target: store-telemetry
    status: verified
    kind: non-functional
    category: resilience
    mandatory: true
    criteria:
      - "ClickHouse writes carry deterministic deduplication tokens or ReplacingMergeTree keys so crash-window Kafka redeliveries do not duplicate visible rows"
      - "Non-replicated telemetry tables enable their deduplication window through a versioned table-settings migration, not a query setting"
      - "Span-derived metrics converge on telemetry.normalized.v1 instead of dual HTTP push"

  - id: req-alerting-query-inversion
    version: "0.1.0"
    target: evaluate-alerts
    status: verified
    kind: functional
    category: contract
    mandatory: true
    criteria:
      - "observable-alerting (domain) consumes store-telemetry within its declared ClickHouse schema compatibility range (services/alert-evaluator/clickhouse-schema-support.yaml) and never depends on query-telemetry while observable-query (application) depends on evaluate-alerts, preserving DAG (COMP-06) and layer ordering (COMP-05)"

  - id: req-pg-schema-isolation
    version: "0.1.0"
    target: manage-control-plane
    status: verified
    kind: functional
    category: contract
    mandatory: true
    criteria:
      - "PostgreSQL schemas auth.*, control.*, and alerting.* maintain explicit table ownership (including control.query_audit_log), zero cross-schema foreign keys, and schema-scoped component roles (observable_auth_role, observable_control_role, observable_alerting_role) with isolated login credentials (observable_auth, observable_control, observable_alerting)"

  # Phase 1/2 authorization gates (docs/plans/phase0-assurance-hardening.md section 4).
  # Refine OBS-25-02 and OBS-14-01 at the new capability boundaries so access control ships with
  # the first catalog and health reads instead of waiting for Phase 8.
  - id: req-decide-access-fail-closed
    version: "0.1.0"
    target: decide-access
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    priority: P0
    owner: ciso
    statement: The policy decision point hides existence, requires purpose where policy demands it, honours elevation expiry and fails closed.
    criteria:
      - "Acceptance: A permitted request returns permit and an audit record with actor, purpose, elevation and decision."
      - "Negative: A denied resource and a non-existent resource return identical responses."
      - "Negative: A purpose-bound request without a stated purpose is denied and recorded."
      - "Negative: A request under an expired elevation grant is denied."
      - "Negative: When the policy store is unavailable, every request is denied."

  - id: req-lookup-principals-tenant-scoped
    version: "0.1.0"
    target: lookup-principals
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    priority: P1
    owner: ciso
    statement: The principal directory resolves each user principal to active, departed or unknown for the requested tenant only.
    criteria:
      - "Acceptance: A member of the tenant resolves active, a known user without a role in the tenant resolves departed and an unknown identifier resolves unknown, in request order without duplicates."
      - "Negative: An active member of another tenant resolves departed, never active."
      - "Negative: When the directory is unavailable, resolution fails instead of returning states."

  - id: req-catalog-access-control
    version: "0.1.0"
    target: manage-service-catalog
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    priority: P0
    owner: ciso
    refines: [OBS-25-02, OBS-14-01]
    depends_on: [req-decide-access-fail-closed]
    statement: Catalog search, lookup and service records are filtered by tenant, role and data classification at the capability boundary through decide-access.
    criteria:
      - "Acceptance: A user sees only the catalog services, owners and support routes the policy decision point permits for the active tenant and role."
      - "Negative: A search or direct lookup for a service the user may not see returns the same response as for a non-existent service and reveals no owner, count or identifier."
      - "Negative: When the policy decision point is unavailable, catalog reads fail closed with an error and never return unfiltered records."

  - id: req-health-access-control
    version: "0.1.0"
    target: assess-service-health
    status: verified
    kind: non-functional
    category: security
    mandatory: true
    priority: P0
    owner: ciso
    refines: [OBS-25-02, OBS-14-01]
    depends_on: [req-decide-access-fail-closed]
    statement: Health states, evidence age and contributing observations are disclosed only for services and evidence the user may access, checked at the capability boundary through decide-access.
    criteria:
      - "Acceptance: A user sees health, last-evidence time and contributing conditions only for services the policy decision point permits."
      - "Negative: A restricted contributing observation is withheld and the health view states that some evidence is restricted; it never exposes the observation and never reports the service as normal because evidence was withheld."
      - "Negative: When the policy decision point is unavailable, health reads fail closed with an error and never return unfiltered observations."

risks:
  - id: risk-at-least-once-duplicates
    target: observable-store-clickhouse
    treatment: mitigation
    mitigated_by:
      - req-dedup-idempotency

  - id: risk-query-alerting-cycle-hazard
    target: observable-alerting
    treatment: mitigation
    mitigated_by:
      - req-alerting-query-inversion

  - id: risk-pg-cross-schema-fks
    target: observable-control
    treatment: mitigation
    mitigated_by:
      - req-pg-schema-isolation

  # Gap: gRPC rate limiting had no test. Closed by the gRPC rate-limit tests bound
  # as evidence of req-ingest-rate-limit.
  - id: risk-ingest-grpc-rate-limit-unverified
    target: ingest-otlp
    treatment: mitigation
    mitigated_by:
      - req-ingest-rate-limit

  # Gap: TenantRateLimiter::set_tenant_limit and MetricCardinalityBudget::set_tenant_budget
  # have no production caller; per-tenant custom quotas cannot be configured at runtime.
  # Only global per-signal defaults (env vars) apply. Accepted by the owner; ROADMAP.md 0.5 states the limit.
  - id: risk-ingest-tenant-quota-not-configurable
    target: ingest-otlp
    treatment: acceptance
    residual_accepted: true

  # Gap: the cardinality count is cumulative submitted series per tenant, held in memory per
  # replica; it never decays or resets except on restart, and enforcement defaults off.
  - id: risk-ingest-cardinality-count-never-resets
    target: ingest-otlp
    treatment: acceptance
    residual_accepted: true

  # Gap: limits key on tenant_id only; there is no per-environment rate limit or budget.
  # Accepted by the owner; ROADMAP.md 0.5 states the limit.
  - id: risk-ingest-no-per-environment-limits
    target: ingest-otlp
    treatment: acceptance
    residual_accepted: true

  # Gap: no code scrubs email, credit-card or bearer-token patterns from span attributes or
  # log bodies; normalise.rs only fills duration, status and tenant_id. Raw PII reaches
  # telemetry.normalized.v1 and ClickHouse. Remediation: PII scrubbing slice in the plan.
  - id: risk-pii-not-scrubbed
    target: normalize-telemetry
    treatment: acceptance
    residual_accepted: true

  # Gap: no service exports a queue-depth metric, and stream-processor has no processing-latency
  # metric. Remediation: queue-depth and latency metrics slice in the plan.
  - id: risk-selfobs-no-queue-depth-latency
    target: observable-platform
    treatment: acceptance
    residual_accepted: true

