openapi: "3.1.0"
info:
  title: Observable Admin API
  version: "1.0.0"
paths:
  /v1/config:
    get:
      summary: Get tenant configuration
      operationId: getConfig
  /v1/config/llm:
    put:
      summary: Update LLM configuration
      operationId: updateLlmConfig
  /v1/tenants/{id}:
    delete:
      summary: Hard purge the session tenant
      description: >-
        tenant_admin of the tenant only. Records the purge request, deletes ClickHouse
        telemetry (asynchronous mutations) and control data, then auth data with a
        tenant_purge audit record. Catalog, health and alerting pull the request from
        GET /internal/tenant-purges and purge their own schemas; pending_components lists
        those that have not acknowledged yet. Idempotent: retry on 503.
      operationId: purgeTenant
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "status, tenant_id, purged_postgres_tables, purged_clickhouse_tables, pending_components"
        "403": { description: Not a tenant_admin of this tenant }
        "503": { description: A purge step failed; nothing after it ran }
  /v1/tenants/usage-report:
    get:
      summary: Get tenant usage report
      operationId: getUsageReport
  /v1/admin/alerts/rules:
    post:
      summary: Create alert rule
      operationId: createAlertRule
  /v1/admin/alerts/rules/{rule_id}:
    patch:
      summary: Update alert rule
      operationId: updateAlertRule
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string, format: uuid }
  /v1/admin/alerts/rules/{rule_id}/owner:
    put:
      summary: Reassign or clear the accountable owner of an alert rule
      operationId: updateAlertRuleOwner
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string, format: uuid }
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
security:
  - CookieAuth: []
