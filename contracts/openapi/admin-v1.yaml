openapi: "3.1.0"
info:
  title: Observable Admin API
  version: "1.0.0"
paths:
  /v1/config:
    get:
      summary: Get tenant configuration
      operationId: getConfig
  /v1/config/llm:
    put:
      summary: Update LLM configuration
      operationId: updateLlmConfig
  /v1/tenants/usage-report:
    get:
      summary: Get tenant usage report
      operationId: getUsageReport
  /v1/admin/alerts/rules:
    post:
      summary: Create alert rule
      operationId: createAlertRule
  /v1/admin/alerts/rules/{rule_id}:
    patch:
      summary: Update alert rule
      operationId: updateAlertRule
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string, format: uuid }
  /v1/admin/alerts/rules/{rule_id}/owner:
    put:
      summary: Reassign or clear the accountable owner of an alert rule
      operationId: updateAlertRuleOwner
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: { type: string, format: uuid }
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session
security:
  - CookieAuth: []
