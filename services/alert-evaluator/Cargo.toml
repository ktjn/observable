[package]
name    = "alert-evaluator"
version = "0.1.0"
edition.workspace = true

[dependencies]
domain             = { path = "../../libs/domain" }
query-core         = { path = "../../libs/query-core" }
observable-config = { path = "../../libs/observable-config" }
observable-telemetry = { path = "../../libs/observable-telemetry" }
observable-auth    = { path = "../../libs/observable-auth" }
tokio              = { workspace = true }
axum               = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
uuid               = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx               = { workspace = true }
clickhouse         = { workspace = true }
reqwest            = { workspace = true }
chrono             = { workspace = true }
prometheus         = { version = "0.14.0", features = ["process"] }
rdkafka            = { workspace = true }
async-trait        = "0.1"

[dev-dependencies]
domain                  = { path = "../../libs/domain" }
observable-storage-contracts = { path = "../../libs/observable-storage-contracts" }
test-support           = { path = "../../libs/test-support" }
testcontainers         = "0.27.0"
testcontainers-modules = { version = "0.15.0", features = ["clickhouse", "postgres"] }
axum               = { workspace = true }
tower              = { version = "0.5", features = ["util"] }
http-body-util     = "0.1"
wiremock           = "0.6"
async-trait        = "0.1"
