# Phase 0 gap classification. Updated as phases land; readiness: scripts/spec-readiness.py
spec_version: observability-spec 2.7.3 (a064fe2)
assessed: '2026-11-07'
method: surface scan of routes, migrations, UI and tests; partial = some related capability exists, not that criteria pass
requirements:
  OBS-01-01:
    priority: P0
    holder: organization
    phase: 1
    target: manage-service-catalog
    status: partial
    evidence: Phase 1 S4. Critical journeys with criticality, owner, ordered services and in-scope flag; GET /v1/catalog/scope lists in-scope services and journeys with criticality and excluded journeys with rationale; a critical journey out of scope is a catalog exception (services/catalog-service/tests/catalog_journeys_integration.rs tests scope_lists_in_scope_services_and_journeys_with_criticality, critical_journey_outside_scope_is_reported_as_a_gap). Organization-held, so inspection evidence comes at phase exit (S9).
  OBS-01-02:
    priority: P0
    holder: organization
    phase: 1
    target: manage-service-catalog
    status: partial
    evidence: Phase 1 S9 audit of S3. Outcome creation and human approval, accountable owner fields and missing-approved-outcome exceptions exist (services/catalog-service/tests/catalog_records_integration.rs::critical_service_without_approved_outcome_is_an_exception). Accountable inspection of actual in-scope records remains pending; see docs/plans/phase1-exit-review.md. No criterion is newly verified.
  OBS-01-03:
    priority: P0
    holder: platform
    phase: 1
    target: manage-service-catalog
    status: verified
    evidence: Phase 1 S4. Environment classes (production, non_production, explicit unclassified) in observable-control (migration 050, /v1/tenants/{id}/environment-classes); GET /v1/catalog/contexts partitions environments and business-critical services; catalog lists restrict to business_critical (services/catalog-service/tests/catalog_journeys_integration.rs). Phase 1 C4.1. GET /v1/review/services keeps production and non-production reviews and reports separate for the same service (services/query-api/tests/it/review_integration.rs). Phase 1 C4.2. The web service record and Service review report select one class at a time (apps/frontend/e2e/catalog.spec.ts). Phase 1 C5. Verified with criterion evidence from catalog contexts, objectives per class, the query review and the web review (spec/system.yaml ev-catalog-contexts-partitioned, ev-objectives-classes-evaluated-apart, ev-review-nonprod-failure-isolated, ev-ui-review-nonprod-failure-isolated).
  OBS-01-04:
    priority: P0
    holder: platform
    phase: 1
    target: manage-service-catalog
    status: verified
    evidence: Phase 1 C3. Approved objectives per catalog service and environment class in observable-alerting (migration 063); GET /v1/objectives/{id}/compliance returns compliant, at_risk, breached, or unknown for missing or stale evidence, and no result for an unapproved objective (services/alert-evaluator/tests/postgres_objectives_integration.rs). Phase 1 C4.1. the query service review combines approved objectives into compliant, at_risk, breached or unknown, never compliant without current evidence (services/query-api/tests/it/review_integration.rs). Phase 1 C4.2. The web service record and Service review report show all four states with their reason (apps/frontend/e2e/catalog.spec.ts). Phase 1 C4.3. The legacy error-rate health pills are retired from query and web; the home banner reports business-critical expectations from the review (apps/frontend/src/pages/HomePage.test.ts). Phase 1 C5. Verified with criterion evidence from objective compliance, the query review and the web review
      (spec/system.yaml ev-objectives-compliance-states, ev-objectives-missing-evidence-unknown, ev-review-expectation-states, ev-review-outage-unknown, ev-ui-review-expectation-states).
