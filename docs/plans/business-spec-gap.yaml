# Project requirements that gate a phase in addition to its OBS P0 set (read by scripts/spec-readiness.py).
refinements:
  req-decide-access-fail-closed:
    priority: P0
    holder: platform
    phase: 1
    target: decide-access
    status: verified
    evidence: Phase 1 S2. observable-auth POST /internal/authz/decide and /filter over the auth policy store (migration 047); real/mock contract suite in services/auth-service/tests/authz_contract_integration.rs and libs/observable-auth/tests/contract_mock.rs.
  req-catalog-access-control:
    priority: P0
    holder: platform
    phase: 1
    target: manage-service-catalog
    status: verified
    evidence: Phase 1 S3. Every catalog read and write goes through decide-access (filter for lists and search); hidden and missing services return the same 404; an unavailable decision point returns 503 (services/catalog-service/tests/catalog_records_integration.rs).
  req-health-access-control:
    priority: P0
    holder: platform
    phase: 2
    target: assess-service-health
    status: missing
    evidence: Health is computed in services/query-api/src/discovery.rs without per-service access filtering.
