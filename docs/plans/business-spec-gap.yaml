refinements:
  req-decide-access-fail-closed:
    priority: P0
    holder: platform
    phase: 1
    target: decide-access
    status: verified
    evidence: Phase 1 S2. observable-auth POST /internal/authz/decide and /filter over the auth policy store (migration 047); real/mock contract suite in services/auth-service/tests/authz_contract_integration.rs and libs/observable-auth/tests/contract_mock.rs.
  req-catalog-access-control:
    priority: P0
    holder: platform
    phase: 1
    target: manage-service-catalog
    status: verified
    evidence: Phase 1 S3. Every catalog read and write goes through decide-access (filter for lists and search); hidden and missing services return the same 404; an unavailable decision point returns 503 (services/catalog-service/tests/catalog_records_integration.rs).
  req-health-access-control:
    priority: P0
    holder: platform
    phase: 2
    target: assess-service-health
    status: verified
    evidence: Phase 1 C2.3 + Phase 2 E7-E8. Health and issue reads enforce tenant isolation and fail closed on PDP outage, query review enforces withheld/unauthorized, and UI renders restricted evidence without leaking counts (services/health-service/tests/health_assessment_integration.rs::reads_fail_closed_and_stay_within_the_callers_tenant, health_issues_integration.rs::issue_reads_fail_closed_and_restricted_evidence_withholds_issues, services/query-api/tests/it/review_integration.rs::review_withheld_health_and_objectives_are_restricted_unknown, apps/frontend/e2e/service-overview.spec.ts::ux-07 restricted evidence shows unknown and restricted without leaking counts).
