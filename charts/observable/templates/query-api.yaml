{{- if .Values.services.queryApi.enabled -}}
{{- $chPass := include "observable.clickhousePasswordEnv" . | fromYaml -}}
{{- $token := include "observable.internalServiceTokenEnv" . | fromYaml -}}
{{- $selfObsTokenEnv := include "observable.selfObservabilityBearerTokenEnv" . | fromYaml -}}
{{- $env := list
    (dict "name" "QUERY_API_PORT"      "value" (toString .Values.services.queryApi.port))
    (dict "name" "CLICKHOUSE_URL"      "value" .Values.clickhouse.url)
    (dict "name" "CLICKHOUSE_USER"     "value" .Values.clickhouse.user)
    $chPass
    (dict "name" "AUTH_SERVICE_URL"   "value" (printf "http://auth-service:%d" (int .Values.services.authService.port)))
    (dict "name" "ADMIN_SERVICE_URL"  "value" (printf "http://admin-service:%d" (int .Values.services.adminService.port)))
    (dict "name" "ALERT_EVALUATOR_URL" "value" (printf "http://alert-evaluator:%d" (int .Values.services.alertEvaluator.port)))
    (dict "name" "CATALOG_URL"        "value" (ternary (printf "http://catalog-service:%d" (int .Values.services.catalogService.port)) "" .Values.services.catalogService.enabled))
    (dict "name" "HEALTH_URL"         "value" (ternary (printf "http://health-service:%d" (int .Values.services.healthService.port)) "" .Values.services.healthService.enabled))
    $token
    (dict "name" "OBSERVABLE_ENV"     "value" .Values.identity.env)
    (dict "name" "OBSERVABLE_SELF_OBSERVABILITY_MODE" "value" .Values.selfObservability.mode)
    (dict "name" "OBSERVABLE_SELF_OBSERVABILITY_OTLP_ENDPOINT" "value" .Values.selfObservability.otlpEndpoint)
    $selfObsTokenEnv -}}
{{- $ctx := dict
    "name"    "query-api"
    "command" "query-api"
    "port"    .Values.services.queryApi.port
    "service" .Values.services.queryApi
    "env"     $env
    "Values"  .Values
    "Chart"   .Chart
    "Release" .Release -}}
{{ include "observable-common.deployment" $ctx }}
---
{{ include "observable-common.service" $ctx }}
{{- end }}
