# Production-like Helm values example for Observable.
#
# Copy this file and fill in the placeholders before deploying:
#   cp values.production-example.yaml values.production.yaml
#   # Edit values.production.yaml with real values
#   helm install observable ./charts/observable -f values.production.yaml
#
# IMPORTANT: Never commit values.production.yaml with real credentials.

global:
  image:
    registry: ghcr.io/ktjn
    pullPolicy: IfNotPresent

# Infrastructure — replace with your actual connection details.
# In production, avoid inline credentials and use existingSecret to reference
# Kubernetes Secrets created by ExternalSecret, Vault CSI, or SealedSecrets.
clickhouse:
  url: "http://clickhouse.infra.svc.cluster.local:8123"
  user: "observable"
  database: "observable"
  # In production, inject CLICKHOUSE_PASSWORD from a Kubernetes Secret:
  existingSecret: "observable-clickhouse-credentials"
  existingSecretKey: "password"
  # password: ""  # Leave blank when existingSecret is used

postgres:
  url: "postgres://observable@postgres.infra.svc.cluster.local:5432/observable"
  user: "observable"
  # Global fallback PostgreSQL credentials secret:
  existingSecret: "observable-postgres-credentials"
  existingSecretKey: "DATABASE_URL"
  existingPasswordKey: "PGPASSWORD"
  # password: ""  # Leave blank when existingSecret is used

redpanda:
  brokers: "redpanda.infra.svc.cluster.local:9093"
  ingestTopic: "telemetry.raw.v1"
  normalizedTopic: "telemetry.normalized.v1"

# Internal service token secret for admin-service /internal/* endpoints
internalServiceTokenSecret: "observable-internal-token"
internalServiceTokenSecretKey: "token"

selfObservability:
  mode: "self"
  otlpEndpoint: "http://ingest-gateway:4317"
  # Set via existingSecret to avoid plaintext API keys in values files:
  existingSecret: "observable-selfobs-credentials"
  existingSecretKey: "bearer-token"

# Identity — MUST be configured for production.
identity:
  # Do NOT set to "dev" in production. Leave empty or omit entirely.
  env: ""
  issuer: "https://auth.example.com"
  apiBase: "http://zitadel:8080"
  clientId: "REPLACE_WITH_OIDC_CLIENT_ID"
  redirectUri: "https://observable.example.com/auth/callback"
  # Inject session signing secret via Kubernetes Secret:
  existingSecret: "observable-session-secret"
  existingSecretKey: "session-secret"

services:
  authService:
    image: { repository: observable-auth, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    # Optional scoped database credentials (AUTH_DATABASE_URL).
    # Enables principle of least privilege / per-service database users.
    existingSecret: "observable-auth-db-credentials"
    existingSecretKey: "AUTH_DATABASE_URL"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  adminService:
    image: { repository: observable-control, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    authServiceUrl: "http://auth-service:4319"
    # Optional scoped database credentials (CONTROL_DATABASE_URL).
    existingSecret: "observable-control-db-credentials"
    existingSecretKey: "CONTROL_DATABASE_URL"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  ingestGateway:
    image: { repository: observable-ingest, tag: "0.1.0" }   # Pin to the component version
    replicas: 3
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

  streamProcessor:
    image: { repository: observable-process, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  storageWriter:
    image: { repository: observable-store-clickhouse, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

  queryApi:
    image: { repository: observable-query, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 1Gi

  alertEvaluator:
    image: { repository: observable-alerting, tag: "0.1.0" }   # Pin to the component version
    replicas: 1
    evalIntervalSeconds: "60"
    # Optional scoped database credentials (ALERTING_DATABASE_URL).
    existingSecret: "observable-alerting-db-credentials"
    existingSecretKey: "ALERTING_DATABASE_URL"
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  frontend:
    image: { repository: observable-web, tag: "0.1.0" }   # Pin to the component version
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

gateway:
  enabled: true
  port: 443
  zitadel:
    hostname: "auth.example.com"

# Prometheus Operator & Grafana monitoring configuration for production.
monitoring:
  prometheusRule:
    enabled: true
    additionalLabels:
      release: prometheus-stack
  serviceMonitor:
    enabled: true
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels:
      release: prometheus-stack
  grafanaDashboard:
    enabled: true
    additionalLabels:
      grafana_dashboard: "1"
