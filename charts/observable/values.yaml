# Observable platform Helm values.
#
# Environment-variable names mirror docker-compose.yml so operators can
# cross-reference the two definitions without separate documentation.
# Override per-environment in a separate values file:
#   helm install observable ./charts/observable -f values.prod.yaml

global:
  image:
    # Optional registry/namespace prefix applied to every component image,
    # e.g. ghcr.io/ktjn. Blank uses the bare repository names (local/kind).
    registry: ""
    pullPolicy: IfNotPresent

# Component images (Phase 7, docs/component-decomposition.md): each service
# below pins its own `image.repository` and `image.tag`. Tags must equal the
# component versions in distribution/manifest.yaml
# (scripts/check-distribution-manifest.sh enforces this). There is no global
# tag override; set services.<name>.image.tag per component.

# Infrastructure connection strings.
# These are consumed by multiple services and centralised here to avoid
# repetition.  They must be overridden in production (use ExternalSecret,
# sealed-secrets, or Vault-injected secrets).
clickhouse:
  url: "http://clickhouse:8123"
  user: "default"
  password: "observable"
  database: "observable"
  # Existing Kubernetes Secret containing ClickHouse credentials.
  # When set, CLICKHOUSE_PASSWORD will be injected via valueFrom.secretKeyRef.
  existingSecret: ""
  existingSecretKey: "CLICKHOUSE_PASSWORD"

postgres:
  # Must include credentials; rotate via ExternalSecret in production.
  url: "postgres://observable:observable@postgres:5432/observable"
  user: "observable"
  password: "observable"
  # Existing Kubernetes Secret containing global fallback PostgreSQL credentials.
  # When set, DATABASE_URL will be injected via valueFrom.secretKeyRef.
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Secret key for postgres-migrate init container when running migrations
  existingPasswordKey: "PGPASSWORD"

redpanda:
  brokers: "redpanda:9093"
  ingestTopic: "telemetry.raw.v1"
  normalizedTopic: "telemetry.normalized.v1"
  deploymentMarkersTopic: "deployment.markers.v1"

# Shared secret for service-to-service calls to admin-service's /internal/*
# routes (query-api's discovery.rs/reliability.rs correlation reads -- Phase
# 4's "remove cross-owner SQL" follow-on, docs/component-decomposition.md).
# Rotate via ExternalSecret in production; this is a dev-only default matching
# docker-compose.yml's.
internalServiceToken: "dev-internal-token-0000"
# When set, INTERNAL_SERVICE_TOKEN will be injected via valueFrom.secretKeyRef.
internalServiceTokenSecret: ""
internalServiceTokenSecretKey: "INTERNAL_SERVICE_TOKEN"

selfObservability:
  # Supported modes:
  # - self: emit platform telemetry to this release's system tenant.
  # - observer_instance: emit platform telemetry to a second Observable instance.
  mode: "self"
  otlpEndpoint: "http://ingest-gateway:4317"
  # bearerToken: set to the plaintext API key for the observable-internal ingestion key.
  # The corresponding key must exist in the api_keys table with environment='observable'.
  bearerToken: ""
  # When set, OBSERVABLE_SELF_OBSERVABILITY_BEARER_TOKEN will be injected via valueFrom.secretKeyRef.
  existingSecret: ""
  existingSecretKey: "OBSERVABLE_SELF_OBSERVABILITY_BEARER_TOKEN"

# Per-service configuration.
# Each block maps directly to one Deployment + one Service.
services:
  authService:
    enabled: true
    image: { repository: observable-auth, tag: "0.1.0" }
    port: 4319
    replicas: 1
    # Scoped database URL or secret (AUTH_DATABASE_URL).
    # Overrides the global postgres.url or postgres.existingSecret.
    databaseUrl: ""
    existingSecret: ""
    existingSecretKey: "AUTH_DATABASE_URL"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  adminService:
    enabled: true
    image: { repository: observable-control, tag: "0.1.0" }
    port: 4324
    replicas: 1
    authServiceUrl: "http://auth-service:4319"
    # Scoped database URL or secret (CONTROL_DATABASE_URL).
    # Overrides the global postgres.url or postgres.existingSecret.
    databaseUrl: ""
    existingSecret: ""
    existingSecretKey: "CONTROL_DATABASE_URL"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ingestGateway:
    enabled: true
    image: { repository: observable-ingest, tag: "0.1.0" }
    port: 4318
    grpcPort: 4317
    platformPort: 4321
    replicas: 1
    # Canary deployment settings.  Set canary.enabled=true and canary.tag to
    # a new image tag to deploy a second ingest-gateway alongside stable for
    # analysis-gated promotion (see scripts/canary-promote.sh).
    canary:
      enabled: false
      tag: ""      # defaults to services.ingestGateway.image.tag when blank
      replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  streamProcessor:
    enabled: true
    image: { repository: observable-process, tag: "0.1.0" }
    replicas: 1
    platformPort: 4323
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  storageWriter:
    enabled: true
    image: { repository: observable-store-clickhouse, tag: "0.1.0" }
    port: 4320
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  queryApi:
    enabled: true
    image: { repository: observable-query, tag: "0.1.0" }
    port: 8090
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  alertEvaluator:
    enabled: true
    image: { repository: observable-alerting, tag: "0.1.0" }
    port: 4322
    replicas: 1
    # Interval at which the evaluator polls for alert conditions (seconds).
    evalIntervalSeconds: "60"
    # Scoped database URL or secret (ALERTING_DATABASE_URL).
    # Overrides the global postgres.url or postgres.existingSecret.
    databaseUrl: ""
    existingSecret: ""
    existingSecretKey: "ALERTING_DATABASE_URL"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  frontend:
    enabled: true
    image: { repository: observable-web, tag: "0.1.0" }
    port: 80
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Zitadel identity provider (subchart: zitadel/zitadel 8.13.4).
# Image is pinned to v2.71.0 (compose baseline) via the image.tag override.
# ExternalDomain/ExternalPort must match the browser-facing Zitadel origin.
# In the Gateway API deployment, the shared listener serves the frontend on `/`
# and routes Zitadel's OIDC/UI paths (`/oauth`, `/oidc`, `/.well-known`, `/ui`)
# to the Zitadel service on the same origin so the browser never loops through
# the frontend SPA for authorization redirects.
# For production override ExternalDomain + ExternalPort to your ingress hostname + 443.
# auth-service uses ZITADEL_API_BASE (in-cluster service) for server-side calls
# and ZITADEL_ISSUER for building browser auth redirects.
zitadel:
  enabled: true
  replicaCount: 1
  image:
    tag: "v2.71.0"
  configMap:
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-delete-policy: before-hook-creation
      helm.sh/hook-weight: "0"
  setupJob:
    machinekeyWriter:
      image:
        tag: latest
  # fsGroup keeps mounted config/secret volumes group-readable by Zitadel's uid
  # (65532) without requiring a root init container.
  podSecurityContext:
    fsGroup: 65532
  env:
    - name: ZITADEL_EXTERNALDOMAIN
      value: "localhost"
    - name: ZITADEL_EXTERNALPORT
      value: "8080"
    - name: ZITADEL_EXTERNALSECURE
      value: "false"
  zitadel:
    masterkey: "observabledevelopermasterkey0000"
    configmapConfig:
      ExternalDomain: localhost
      ExternalPort: 8080
      ExternalSecure: false
      TLS:
        Enabled: false
      FirstInstance:
        InstanceName: Observable Dev
        Org:
          Name: Observable
          Machine:
            Machine:
              Username: bootstrap-sa
              Name: Bootstrap Service Account
            MachineKey:
              Type: 1
              ExpirationDate: "2099-01-01T00:00:00Z"
          Human:
            UserName: admin
            FirstName: Dev
            LastName: Admin
            Email:
              Address: admin@dev.observable
              IsEmailVerified: true
            Password: Dev@Admin1234!
            PasswordChangeRequired: false
    dbSslCaCrt: ""
  env:
    - name: ZITADEL_DATABASE_POSTGRES_HOST
      value: postgres
    - name: ZITADEL_DATABASE_POSTGRES_PORT
      value: "5432"
    - name: ZITADEL_DATABASE_POSTGRES_DATABASE
      value: zitadel
    - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
      valueFrom:
        secretKeyRef:
          name: postgres-auth
          key: username
    - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-auth
          key: password
    - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
      value: disable
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: postgres-auth
          key: username
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-auth
          key: password
    - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
      value: disable
  ingress:
    enabled: false
  podDisruptionBudget:
    enabled: false

# OIDC / session settings consumed by auth-service.
# issuer defaults to http://{ExternalDomain}:{ExternalPort} (browser-reachable, matches token iss)
# and is expected to point at the Gateway listener that routes /oauth + /ui to Zitadel.
# apiBase defaults to the in-cluster Zitadel service URL ({release-name}-zitadel:8080) for server-side calls.
identity:
  issuer: ""
  apiBase: ""
  clientId: ""
  redirectUri: "http://localhost:8080/v1/auth/callback"
  # REQUIRED for any non-dev install: a random, unique session-signing secret
  # (e.g. `openssl rand -base64 32`). Left empty by default so auth-service
  # fails closed instead of starting with a guessable default secret.
  # Can be injected directly or via existingSecret.
  sessionSecret: ""
  existingSecret: ""
  existingSecretKey: "SESSION_SECRET"
  env: "dev"

# Kubernetes Gateway API — attaches Zitadel browser paths to the shared
# observable Gateway so the browser stays on one origin.
#
# The frontend stays on `/`; Zitadel owns `/oauth`, `/oidc`, `/.well-known`,
# and `/ui` on the same browser-facing origin.  auth-service derives
# ZITADEL_ISSUER from gateway.zitadel.hostname + gateway.port automatically
# (identity.issuer still overrides if set).  Keep the Zitadel subchart aligned
# so its token iss claim matches:
#   zitadel.zitadel.configmapConfig.ExternalDomain: <gateway.zitadel.hostname or localhost>
#   zitadel.zitadel.configmapConfig.ExternalPort:   <gateway.port>
gateway:
  enabled: true
  # Existing shared Gateway resource to attach the Zitadel route to.
  name: testbench-gateway
  sectionName: observable
  port: 8080   # browser-facing port used to build ZITADEL_ISSUER
  zitadel:
    hostname: ""    # e.g. "auth.example.com" — omit to match all hostnames

# Migration job settings (pre-install / pre-upgrade Helm hook).
migrations:
  # BackoffLimit for the migration Job before Helm marks the hook failed.
  backoffLimit: 3
  # ConfigMap names that must exist before helm install.
  # Created by scripts/kind-test.sh (kind) or the release pipeline (CI).
  postgresConfigMap: observable-migrations-postgres
  clickhouseConfigMap: observable-migrations-clickhouse

# Platform monitoring, alerting rules, and dashboards.
# Integrates with prometheus-operator and kube-prometheus-stack.
monitoring:
  # Deploys monitoring.coreos.com/v1 PrometheusRule resources for critical platform paths
  prometheusRule:
    enabled: false
    additionalLabels: {}
      # release: kube-prometheus-stack
  # Deploys monitoring.coreos.com/v1 ServiceMonitor resources scraping /metrics
  serviceMonitor:
    enabled: false
    interval: "15s"
    scrapeTimeout: "10s"
    additionalLabels: {}
      # release: kube-prometheus-stack
  # Deploys a ConfigMap containing the Observable Platform Health Grafana dashboard
  grafanaDashboard:
    enabled: false
    additionalLabels: {}
      # grafana_dashboard: "1"
